function friendlyAuthError(error) {
  const code = error && error.code;
  const map = {
    'auth/email-already-in-use': 'An account with this email already exists. Try signing in instead.',
    'auth/invalid-email': 'Please enter a valid email address.',
    'auth/user-disabled': 'This account has been suspended. Please contact support.',
    'auth/user-not-found': 'No account found with that email or password.',
    'auth/wrong-password': 'No account found with that email or password.',
    'auth/invalid-credential': 'No account found with that email or password.',
    'auth/missing-password': 'Please enter your password.',
    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/popup-closed-by-user': 'Sign-in was cancelled.',
    'auth/cancelled-popup-request': 'Sign-in was cancelled.',
    'auth/popup-blocked': "Your browser blocked the sign-in popup. Please allow popups for this site and try again.",
    'auth/network-request-failed': 'Network error. Please check your connection and try again.',
    'auth/operation-not-allowed': 'This sign-in method is not enabled yet. Please contact the site owner.'
  };
  if (!FIREBASE_CONFIGURED) return 'This site is not fully set up yet (missing Firebase configuration). Please contact the site owner.';
  return map[code] || (error && error.message) || 'Something went wrong. Please try again.';
}

// ===== src/services/authService.js =====
const USERS_COL = 'users';
let _profileWriteInFlight = null;

function emptyProfileFromFirebaseUser(fbUser, roleFallback) {
  return {
    uid: fbUser.uid,
    fullName: fbUser.displayName || 'User',
    email: fbUser.email || '',
    phone: fbUser.phoneNumber || '',
    role: roleFallback || 'tenant',
    profileImage: fbUser.photoURL || '',
    isVerified: false,
    suspended: false,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };
}

function toStoreUser(fbUser, profileData) {
  const p = profileData || {};
  return {
    uid: fbUser.uid,
    name: p.fullName || fbUser.displayName || 'User',
    email: p.email || fbUser.email || '',
    phone: p.phone || fbUser.phoneNumber || '',
    role: p.role || 'tenant',
    profileImage: p.profileImage || fbUser.photoURL || '',
    isVerified: !!p.isVerified,
    suspended: !!p.suspended
  };
}

const AuthService = {
  isConfigured() { return FIREBASE_CONFIGURED; },

  async register({ email, password, fullName, phone, role }) {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const profile = {
      uid: cred.user.uid,
      fullName,
      email,
      phone: phone || '',
      role: role || 'tenant',
      profileImage: '',
      isVerified: false,
      suspended: false,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };
    _profileWriteInFlight = (async () => {
      try { await updateProfile(cred.user, { displayName: fullName }); } catch (e) { /* non-fatal */ }
      await setDoc(doc(db, USERS_COL, cred.user.uid), profile);
    })();
    await _profileWriteInFlight;
    _profileWriteInFlight = null;
    return profile;
  },

  async login(email, password) {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    return cred.user;
  },

  async loginWithGoogle() {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    const existingSnap = await getDoc(doc(db, USERS_COL, result.user.uid));
    if (!existingSnap.exists()) {
      const profile = emptyProfileFromFirebaseUser(result.user, 'tenant');
      _profileWriteInFlight = setDoc(doc(db, USERS_COL, result.user.uid), profile);
      await _profileWriteInFlight;
      _profileWriteInFlight = null;
    }
    return result.user;
  },

  async logout() {
    await signOut(auth);
  },

  async resetPassword(email) {
    await sendPasswordResetEmail(auth, email);
  },

  async getUserProfile(uid) {
    const snap = await getDoc(doc(db, USERS_COL, uid));
    return snap.exists() ? snap.data() : null;
  },

  async updateUserProfile(uid, patch) {
    await updateDoc(doc(db, USERS_COL, uid), { ...patch, updatedAt: serverTimestamp() });
    const current = window.store && window.store.getState('currentUser');
    if (current && current.uid === uid) {
      window.store.setState('currentUser', { ...current, ...patch });
    }
  }
};

onAuthStateChanged(auth, async (fbUser) => {
  const store = window.store;
  if (!fbUser) {
    if (store) { store.setState('currentUser', null); store.setState('authReady', true); }
    return;
  }
  if (_profileWriteInFlight) {
    try { await _profileWriteInFlight; } catch (e) { /* ignore, handled below */ }
  }
  try {
    let snap = await getDoc(doc(db, USERS_COL, fbUser.uid));
    if (!snap.exists()) {
      const minimal = emptyProfileFromFirebaseUser(fbUser, 'tenant');
      await setDoc(doc(db, USERS_COL, fbUser.uid), minimal, { merge: true });
      snap = await getDoc(doc(db, USERS_COL, fbUser.uid));
    }
    const profileData = snap.data();
    if (store) {
      store.setState('currentUser', toStoreUser(fbUser, profileData));
      try { await FavoritesService.mergeGuestFavoritesOnLogin(fbUser.uid); } catch (e) { console.warn('[Favorites] merge on login failed', e); }
    }
  } catch (e) {
    console.error('[AuthService] Failed to load/create user profile:', e);
    if (store) store.setState('currentUser', toStoreUser(fbUser, null));
  } finally {
    if (store) store.setState('authReady', true);
  }
});

function compressImageFile(file, maxDimension = 1600, quality = 0.75) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) {
      reject(new Error('Only image files are allowed.'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the selected file.'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode the selected image.'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          const scale = maxDimension / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('Image compression failed.'));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function randomId() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

const StorageService = {
  /**
   * Compresses and uploads one or more images for a property.
   * @param {FileList|File[]} files
   * @param {string} propertyId
   * @param {(progress:number, index:number, total:number)=>void} [onProgress] progress in [0,1] for the current file
   * @returns {Promise<string[]>} download URLs, in the same order as `files`
   */
  async uploadPropertyImages(files, propertyId, onProgress) {
    const list = Array.from(files || []);
    const urls = [];
    for (let i = 0; i < list.length; i++) {
      const file = list[i];
      if (file.size > 10 * 1024 * 1024) throw new Error(`"${file.name}" is larger than 10MB. Please choose a smaller image.`);
      const compressed = await compressImageFile(file);
      const path = `properties/${propertyId}/${randomId()}.jpg`;
      const storageRef = ref(storage, path);
      const url = await new Promise((resolve, reject) => {
        const task = uploadBytesResumable(storageRef, compressed, { contentType: 'image/jpeg' });
        task.on('state_changed',
          (snap) => { if (onProgress) onProgress(snap.bytesTransferred / snap.totalBytes, i, list.length); },
          reject,
          async () => { try { resolve(await getDownloadURL(task.snapshot.ref)); } catch (err) { reject(err); } }
        );
      });
      urls.push(url);
    }
    return urls;
  },

  async uploadProfileImage(file, uid) {
    if (file.size > 5 * 1024 * 1024) throw new Error('Profile photo must be under 5MB.');
    const compressed = await compressImageFile(file, 512, 0.8);
    const storageRef = ref(storage, `profile-images/${uid}/${randomId()}.jpg`);
    await uploadBytesResumable(storageRef, compressed, { contentType: 'image/jpeg' });
    return getDownloadURL(storageRef);
  },

  async deleteByPath(path) {
    try { await deleteObject(ref(storage, path)); } catch (e) { console.warn('[StorageService] delete failed (non-fatal):', e); }
  }
};

// ===== src/services/propertyService.js =====
const PROPERTIES_COL = 'properties';

function toClientProperty(docSnap) {
  const data = docSnap.data() || {};
  return {
    id: docSnap.id,
    ...data,
    agent: {
      name: data.ownerName || 'Owner',
      phone: data.ownerPhone || '',
      image: data.ownerProfileImage || 'https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=100&q=80',
      rating: typeof data.ownerRating === 'number' ? data.ownerRating : 4.8,
      telegram: data.ownerTelegram || ''
    }
  };
}

const PropertyService = {
  async create(propertyData, ownerUser) {
    if (!ownerUser || !ownerUser.uid) throw new Error('You must be signed in to list a property.');
    const payload = {
      title: propertyData.title || '',
      description: propertyData.description || '',
      price: Number(propertyData.price) || 0,
      currency: 'ETB',
      type: propertyData.type || 'apartment',
      listingType: propertyData.listingType || 'buy',
      beds: Number(propertyData.beds) || 0,
      baths: Number(propertyData.baths) || 0,
      area: Number(propertyData.area) || 0,
      city: propertyData.city || 'addis',
      subCity: propertyData.subCity || '',
      woreda: propertyData.woreda || '',
      area_name: propertyData.neighborhood || propertyData.area_name || '',
      location: propertyData.address || propertyData.location || '',
      address: propertyData.address || propertyData.location || '',
      lat: propertyData.lat != null ? Number(propertyData.lat) : 9.0084,
      lng: propertyData.lng != null ? Number(propertyData.lng) : 38.7575,
      images: propertyData.images || [],
      image: (propertyData.images && propertyData.images[0]) || '',
      amenities: propertyData.amenities || [],
      featured: false,
      new: true,
      premium: false,
      ownerId: ownerUser.uid,
      ownerName: ownerUser.name || 'Owner',
      ownerPhone: ownerUser.phone || '',
      ownerProfileImage: ownerUser.profileImage || '',
      ownerTelegram: propertyData.ownerTelegram || '',
      ownerRole: ownerUser.role || 'landlord',
      isVerified: false,
      status: 'pending',
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };
    const docRef = await addDoc(collection(db, PROPERTIES_COL), payload);
    return docRef.id;
  },

  async update(propertyId, patch) {
    const clean = { ...patch, updatedAt: serverTimestamp() };
    if (clean.price != null) clean.price = Number(clean.price);
    if (clean.beds != null) clean.beds = Number(clean.beds);
    if (clean.baths != null) clean.baths = Number(clean.baths);
    if (clean.area != null) clean.area = Number(clean.area);
    if (clean.images) clean.image = clean.images[0] || '';
    if (clean.lat != null) clean.lat = Number(clean.lat);
    if (clean.lng != null) clean.lng = Number(clean.lng);
    if (clean.neighborhood != null) { clean.area_name = clean.neighborhood; delete clean.neighborhood; }
    if (clean.address != null) clean.location = clean.address;
    await updateDoc(doc(db, PROPERTIES_COL, propertyId), clean);
  },

  async remove(propertyId) {
    await deleteDoc(doc(db, PROPERTIES_COL, propertyId));
  },

  async getById(propertyId) {
    const snap = await getDoc(doc(db, PROPERTIES_COL, propertyId));
    return snap.exists() ? toClientProperty(snap) : null;
  },

  async getFeatured(max = 3) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), where('featured', '==', true), limit(max));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getNewListings(max = 4) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), orderBy('createdAt', 'desc'), limit(max));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getByOwner(ownerId) {
    const q = query(collection(db, PROPERTIES_COL), where('ownerId', '==', ownerId), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getByArea(areaName, max = 20) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), where('area_name', '==', areaName), limit(max));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getSimilar(property, max = 4) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), where('type', '==', property.type), limit(max + 1));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty).filter((p) => p.id !== property.id).slice(0, max);
  },

  /**
   * Hybrid search: narrows on the server by the two most selective, always-present
   * filters (status + listingType) to avoid downloading the whole collection, then
   * refines the returned page client-side by every other filter. See project notes
   * for why (Firestore composite-index limits on many optional filter combinations).
   */
  async search(filters = {}, { pageSize = 20, cursor = null } = {}) {
    const constraints = [where('status', '==', 'approved')];
    if (filters.listingType) constraints.push(where('listingType', '==', filters.listingType));
    constraints.push(orderBy('createdAt', 'desc'));
    if (cursor) constraints.push(startAfter(cursor));
    constraints.push(limit(pageSize));

    const snap = await getDocs(query(collection(db, PROPERTIES_COL), ...constraints));
    let results = snap.docs.map(toClientProperty);
    const lastDoc = snap.docs[snap.docs.length - 1] || null;

    if (filters.city) results = results.filter((p) => p.city === filters.city);
    if (filters.subCity) results = results.filter((p) => p.subCity === filters.subCity);
    if (filters.woreda) results = results.filter((p) => (p.woreda || '').toLowerCase().includes(filters.woreda.toLowerCase()));
    if (filters.neighborhood) results = results.filter((p) => (p.area_name || '').toLowerCase().includes(filters.neighborhood.toLowerCase()));
    if (filters.type) results = results.filter((p) => p.type === filters.type);
    if (filters.types && filters.types.length) results = results.filter((p) => filters.types.includes(p.type));
    if (filters.beds) results = results.filter((p) => Number(p.beds || 0) >= Number(filters.beds));
    if (filters.baths) results = results.filter((p) => Number(p.baths || 0) >= Number(filters.baths));
    if (filters.minPrice) results = results.filter((p) => Number(p.price || 0) >= Number(filters.minPrice));
    if (filters.maxPrice) results = results.filter((p) => Number(p.price || 0) <= Number(filters.maxPrice));
    if (filters.minArea) results = results.filter((p) => Number(p.area || 0) >= Number(filters.minArea));
    if (filters.maxArea) results = results.filter((p) => Number(p.area || 0) <= Number(filters.maxArea));
    if (filters.amenities && filters.amenities.length) {
      results = results.filter((p) => filters.amenities.every((a) => (p.amenities || []).includes(a)));
    }
    return { results, lastDoc, hasMore: snap.docs.length === pageSize };
  }
};

// ===== src/services/favoritesService.js =====
const FavoritesService = {
  async list(uid) {
    const snap = await getDocs(collection(db, USERS_COL, uid, 'favorites'));
    return snap.docs.map((d) => d.id);
  },
  async add(uid, propertyId) {
    await setDoc(doc(db, USERS_COL, uid, 'favorites', String(propertyId)), {
      propertyId: String(propertyId),
      createdAt: serverTimestamp()
    });
  },
  async remove(uid, propertyId) {
    await deleteDoc(doc(db, USERS_COL, uid, 'favorites', String(propertyId)));
  },
  async mergeGuestFavoritesOnLogin(uid) {
    const guestFavs = (window.Storage && window.Storage.get('favorites')) || [];
    const remoteFavs = await this.list(uid);
    const remoteSet = new Set(remoteFavs.map(String));
    const toAdd = guestFavs.map(String).filter((id) => !remoteSet.has(id));
    if (toAdd.length) await Promise.all(toAdd.map((id) => this.add(uid, id)));
    const merged = Array.from(new Set([...remoteFavs.map(String), ...guestFavs.map(String)]));
    if (window.store) window.store.setState('favorites', merged);
    if (window.Storage) window.Storage.set('favorites', merged);
  }
};

const ReportService = {
  async create({ propertyId, reason, details }) {
    const user = auth.currentUser;
    if (!user) throw new Error('Please sign in to report a listing.');
    await addDoc(collection(db, 'reports'), {
      propertyId: String(propertyId),
      reason: reason || 'other',
      details: details || '',
      reporterId: user.uid,
      status: 'open',
      createdAt: serverTimestamp()
    });
  }
};

const AdminService = {
  async listUsers() {
    const snap = await getDocs(collection(db, USERS_COL));
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  },
  async listProperties(status) {
    const constraints = [];
    if (status) constraints.push(where('status', '==', status));
    constraints.push(orderBy('createdAt', 'desc'));
    const snap = await getDocs(query(collection(db, PROPERTIES_COL), ...constraints));
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  },
  async approveProperty(id) {
    await updateDoc(doc(db, PROPERTIES_COL, id), { status: 'approved', updatedAt: serverTimestamp() });
  },
  async rejectProperty(id, reason) {
    await updateDoc(doc(db, PROPERTIES_COL, id), { status: 'rejected', rejectionReason: reason || '', updatedAt: serverTimestamp() });
  },
  async verifyProperty(id, verified = true) {
    await updateDoc(doc(db, PROPERTIES_COL, id), { isVerified: verified, updatedAt: serverTimestamp() });
  },
  async deleteProperty(id) {
    await deleteDoc(doc(db, PROPERTIES_COL, id));
  },
  async verifyUser(uid, verified = true) {
    await updateDoc(doc(db, USERS_COL, uid), { isVerified: verified });
  },

/**
 * HTML Sanitizer - prevents XSS by escaping dangerous content.
 * Replaces innerHTML with safe text insertion where possible.
 */
const Sanitizer = {
  _escapeMap: {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#x27;',
    '/': '&#x2F;',
    '`': '&#x60;',
    '=': '&#x3D;'
  },

  escape(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"'`=/]/g, s => this._escapeMap[s]);
  },

  /**
   * Validates and sanitizes a URL to prevent javascript: protocol injection.
   */
  sanitizeUrl(url) {
    if (!url) return '';
    const sanitized = String(url).trim();
    const forbidden = /^javascript:/i;
    if (forbidden.test(sanitized)) return '';
    return sanitized;
  },

  /**
   * Creates a DocumentFragment from HTML string, stripping scripts and event handlers.
   */
  createSafeFragment(html) {
    const template = document.createElement('template');
    template.innerHTML = html;
    const fragment = template.content;
    // Remove all script tags and event handlers
    fragment.querySelectorAll('script').forEach(el => el.remove());
    fragment.querySelectorAll('*').forEach(el => {
      const attrs = Array.from(el.attributes);
      attrs.forEach(attr => {
        if (attr.name.startsWith('on') || attr.name === 'srcdoc') {
          el.removeAttribute(attr.name);
        }
      });
    });
    return fragment;
  }
};

/**
 * Input Validator - client-side validation for forms.
 */
const Validator = {
  email(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(String(email).trim());
  },

  phone(phone) {
    const re = /^\+?[0-9\s\-]{8,20}$/;
    return re.test(String(phone).trim());
  },

  required(value) {
    return String(value).trim().length > 0;
  },

  minLength(value, min) {
    return String(value).trim().length >= min;
  },

  number(value, min, max) {
    const num = Number(value);
    if (Number.isNaN(num)) return false;
    if (min !== undefined && num < min) return false;
    if (max !== undefined && num > max) return false;
    return true;
  },

  price(value) {
    return this.number(value, 0, 100000000000);
  }
};

/**
 * CSRF Token Generator - prepares for backend integration.
 */
const CSRF = {
  _token: null,

  generate() {
    const array = new Uint8Array(32);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(array);
    } else {
      for (let i = 0; i < 32; i++) array[i] = Math.floor(Math.random() * 256);
    }
    this._token = Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
    return this._token;
  },

  getToken() {
    if (!this._token) this.generate();
    return this._token;
  },

  getHeader() {
    return { 'X-CSRF-Token': this.getToken() };
  }
};

/**
 * Debounce utility - limits execution rate for expensive operations.
 */
function debounce(fn, wait = 300) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      fn(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

/**
 * Throttle utility - ensures function runs at most once per period.
 */
function throttle(fn, limit = 100) {
  let inThrottle;
  return function executedFunction(...args) {
    if (!inThrottle) {
      fn(...args);
      inThrottle = true;
      setTimeout(() => inThrottle = false, limit);
    }
  };
}

/**
 * Memoize utility - caches function results.
 */
function memoize(fn, keyFn = JSON.stringify) {
  const cache = new Map();
  return function memoized(...args) {
    const key = keyFn(args);
    if (cache.has(key)) return cache.get(key);
    const result = fn.apply(this, args);
    cache.set(key, result);
    return result;
  };
}

/**
 * LazyLoader - IntersectionObserver-based image lazy loading.
 */
const LazyLoader = {
  _observer: null,
  _init() {
    if (this._observer) return;
    if (!('IntersectionObserver' in window)) {
      // Fallback: load all images immediately
      document.querySelectorAll('img[data-src]').forEach(img => {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      });
      return;
    }
    this._observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          if (img.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');
            img.classList.add('loaded');
          }
          this._observer.unobserve(img);
        }
      });
    }, { rootMargin: '50px' });
  },

  observe(img) {
    this._init();
    if (this._observer && img.dataset.src) {
      this._observer.observe(img);
    }
  },

  observeAll(container = document) {
    this._init();
    if (!this._observer) return;
    container.querySelectorAll('img[data-src]').forEach(img => this._observer.observe(img));
  }
};

// ACCESSIBILITY UTILITIES

/**
 * FocusTrap - traps keyboard focus within a modal/dialog.
 */
const FocusTrap = {
  _activeTrap: null,
  _previousFocus: null,

  activate(container, returnFocus = true) {
    if (this._activeTrap) this.deactivate();
    if (returnFocus) this._previousFocus = document.activeElement;

    const focusable = container.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    const first = focusable[0];
    const last = focusable[focusable.length - 1];

    const handler = (e) => {
      if (e.key !== 'Tab') return;
      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last?.focus();
        }
      } else {
        if (document.activeElement === last) {
          e.preventDefault();
          first?.focus();
        }
      }
    };

    container.addEventListener('keydown', handler);
    this._activeTrap = { container, handler };
    first?.focus();
  },

  deactivate() {
    if (this._activeTrap) {
      this._activeTrap.container.removeEventListener('keydown', this._activeTrap.handler);
      this._activeTrap = null;
    }
    if (this._previousFocus) {
      this._previousFocus.focus();
      this._previousFocus = null;
    }
  }
};

/**
 * Announcer - announces changes to screen readers.
 */
const Announcer = {
  _el: null,

  _getEl() {
    if (!this._el) {
      this._el = document.getElementById('aria-live-announcer');
    }
    return this._el;
  },

  announce(message, priority = 'assertive') {
    const el = this._getEl();
    if (!el) return;
    el.setAttribute('aria-live', priority);
    // Clear and set to ensure announcement
    el.textContent = '';
    requestAnimationFrame(() => {
      el.textContent = message;
    });
  }
};

/**
 * Keyboard utility - handles Escape key for modals.
 */
const Keyboard = {
  _handlers: new Map(),

  onEscape(handler) {
    const wrapper = (e) => {
      if (e.key === 'Escape') handler(e);
    };
    this._handlers.set(handler, wrapper);
    document.addEventListener('keydown', wrapper);
  },

  offEscape(handler) {
    const wrapper = this._handlers.get(handler);
    if (wrapper) {
      document.removeEventListener('keydown', wrapper);
      this._handlers.delete(handler);
    }
  }
};

(function() {
function formatPrice(price, type = 'buy') {
  if (type === 'rent') return 'ETB ' + price.toLocaleString() + '/mo';
  if (price >= 1000000) return 'ETB ' + (price / 1000000).toFixed(1) + 'M';
  return 'ETB ' + price.toLocaleString();
}

function formatPriceFull(price) {
  return 'ETB ' + price.toLocaleString();
}

function formatNumber(num) {
  return num.toLocaleString();
}

function capitalize(str) {
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1);
}

  window.formatPrice = formatPrice;
  window.formatPriceFull = formatPriceFull;
  window.capitalize = capitalize;
})();

// ===== src/utils/dom.js =====
(function() {
const _cleanupRegistry = new WeakMap();

function createElement(html) {
  const template = document.createElement('template');
  template.innerHTML = html.trim();
  return template.content.firstChild;
}

function delegate(container, selector, eventType, handler) {
  if (!container) return function(){};
  const wrapped = (e) => {
    const target = e.target.closest(selector);
    if (target && container.contains(target)) {
      handler(e, target);
    }
  };
  container.addEventListener(eventType, wrapped);
  // Track for cleanup
  if (!_cleanupRegistry.has(container)) _cleanupRegistry.set(container, []);
  _cleanupRegistry.get(container).push({ eventType, wrapped });
  return () => container.removeEventListener(eventType, wrapped);
}

function qs(selector, context = document) {
  return context.querySelector(selector);
}

function qsa(selector, context = document) {
  return context.querySelectorAll(selector);
}

function setHTML(element, html) {
  if (element) {
    // Clear previous listeners before replacing content
    cleanupElement(element);
    element.innerHTML = html;
  }
  return element;
}

function cleanupElement(element) {
  const listeners = _cleanupRegistry.get(element);
  if (listeners) {
    listeners.forEach(({ eventType, wrapped }) => {
      element.removeEventListener(eventType, wrapped);
    });
    _cleanupRegistry.delete(element);
  }
  // Recursively cleanup children
  element.querySelectorAll('*').forEach(child => {
    const childListeners = _cleanupRegistry.get(child);
    if (childListeners) {
      childListeners.forEach(({ eventType, wrapped }) => {
        child.removeEventListener(eventType, wrapped);
      });
      _cleanupRegistry.delete(child);
    }
  });
}

  window.createElement = createElement;
  window.delegate = delegate;
  window.qs = qs;
  window.qsa = qsa;
  window.setHTML = setHTML;
  window.cleanupElement = cleanupElement;
})();

(function() {
const container = document.getElementById('toast-container');

const Toast = {
  show(message, type = 'success', duration = 3000) {
    if (!container) return;

    const icons = {
      success: 'check-circle',
      error: 'exclamation-circle',
      info: 'info-circle'
    };

    const colors = {
      success: 'bg-green-500',
      error: 'bg-red-500',
      info: 'bg-brand-600'
    };

    const toast = document.createElement('div');
    toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 min-w-[280px]`;
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    toast.innerHTML = `<i class="fas fa-${icons[type]}" aria-hidden="true"></i><span class="text-sm font-medium">${Sanitizer.escape(message)}</span>`;

    container.appendChild(toast);
    Announcer.announce(message, 'polite');

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }
};

function showToast(message, type = 'success', duration = 3000) {
  Toast.show(message, type, duration);
}

  window.Toast = Toast;
  window.showToast = showToast;
})();

(function() {
const PREFIX = 'addisBet_';

const Storage = {
  get(key, defaultValue = null) {
    try {
      const item = localStorage.getItem(PREFIX + key);
      return item ? JSON.parse(item) : defaultValue;
    } catch {
      return defaultValue;
    }
  },

  set(key, value) {
    try {
      localStorage.setItem(PREFIX + key, JSON.stringify(value));
    } catch (e) {
      console.warn('Storage set failed:', e);
    }
  },

  remove(key) {
    localStorage.removeItem(PREFIX + key);
  },

  clear() {
    Object.keys(localStorage)
      .filter(k => k.startsWith(PREFIX))
      .forEach(k => localStorage.removeItem(k));
  }
};

  window.Storage = Storage;
})();

(function() {
let mapInstance = null;
let markers = [];

const MapService = {
  init(containerId, center = [9.0054, 38.7636], zoom = 13) {
    this.destroy();
    const container = document.getElementById(containerId);
    if (!container) return null;
    if (typeof L === 'undefined') {
      console.warn('Leaflet library not loaded');
      return null;
    }

    try {
      mapInstance = L.map(containerId).setView(center, zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap</a> contributors'
      }).addTo(mapInstance);
      return mapInstance;
    } catch (e) {
      console.error('Map initialization failed:', e);
      return null;
    }
  },

  addMarker(lat, lng, popupHtml = null) {
    if (!mapInstance || typeof L === 'undefined') return null;
    try {
      const marker = L.marker([lat, lng]).addTo(mapInstance);
      if (popupHtml) {
        marker.bindPopup(popupHtml);
      }
      markers.push(marker);
      return marker;
    } catch (e) {
      console.error('Add marker failed:', e);
      return null;
    }
  },

  addPropertyMarker(property, onClick) {
    if (!mapInstance || typeof L === 'undefined') return null;
    const popup = `
      <div data-property-id="${property.id}" style="cursor:pointer">
        <img src="${Sanitizer.sanitizeUrl(property.image)}" style="width:100%;height:140px;object-fit:cover;border-radius:8px 8px 0 0;margin:-1px" alt="${Sanitizer.escape(property.title)}">
        <div style="padding:12px">
          <div style="font-weight:bold;font-size:14px;margin-bottom:4px">${Sanitizer.escape(property.title)}</div>
          <div style="color:#0ea5e9;font-weight:600;font-size:13px">${property.formattedPrice || ''}</div>
          <div style="font-size:12px;color:#666;margin-top:4px">${property.beds} beds &middot; ${property.baths} baths &middot; ${property.area}m&sup2;</div>
        </div>
      </div>
    `;
    const marker = this.addMarker(property.lat, property.lng, popup);
    if (marker && onClick) {
      marker.on('click', () => onClick(property.id));
    }
    return marker;
  },

  clearMarkers() {
    markers.forEach(m => {
      if (mapInstance) mapInstance.removeLayer(m);
    });
    markers = [];
  },

  setView(center, zoom) {
    if (mapInstance) mapInstance.setView(center, zoom);
  },

  destroy() {
    this.clearMarkers();
    if (mapInstance) {
      try {
        mapInstance.remove();
      } catch (e) {
        console.warn('Map destroy failed:', e);
      }
      mapInstance = null;
    }
  },

  getInstance() {
    return mapInstance;
  },

  invalidateSize() {
    if (mapInstance) mapInstance.invalidateSize();
  }
};

  window.MapService = MapService;
})();

(function() {
const MortgageService = {
  calculate({ price, downPayment = 0, interestRate = 12, years = 20 }) {
    const principal = Math.max(0, price - downPayment);
    const monthlyRate = interestRate / 100 / 12;
    const numPayments = years * 12;

    let monthly = 0;
    if (monthlyRate > 0 && principal > 0) {
      monthly = principal *
        (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) /
        (Math.pow(1 + monthlyRate, numPayments) - 1);
    } else if (principal > 0) {
      monthly = principal / numPayments;
    }

    const totalPayment = monthly * numPayments;
    const totalInterest = totalPayment - principal;

    return {
      monthly: Math.round(monthly),
      totalInterest: Math.round(totalInterest),
      totalPayment: Math.round(totalPayment),
      principal
    };
  }
};

  window.MortgageService = MortgageService;
})();

(function() {
class Store {
  constructor() {
    this.state = {
      currentUser: null,
      authReady: false,
      favorites: [],
      currentLang: 'en',
      darkMode: false,
      currentPage: 'home',
      currentPropertyId: null,
      searchFilters: { listingType: 'buy' },
      listingsView: 'grid',
      authTab: 'login',
      isMobileMenuOpen: false,
      toastQueue: []
    };
    this.listeners = {};
    this._batchDepth = 0;
    this._pendingKeys = new Set();
    this._transaction = false;
    this.loadPersistedState();
  }

  loadPersistedState() {
    try {
      const favs = Storage.get('favorites');
      const dark = Storage.get('darkMode');
      if (favs !== null) this.state.favorites = favs;
      if (dark !== null) this.state.darkMode = dark;
    } catch (e) {
      console.error('Failed to load persisted state', e);
    }
  }

  subscribe(key, callback) {
    if (!this.listeners[key]) this.listeners[key] = [];
    this.listeners[key].push(callback);
    callback(this.state[key], undefined);
    return () => {
      this.listeners[key] = this.listeners[key].filter(cb => cb !== callback);
    };
  }

  setState(key, value) {
    const oldValue = this.state[key];
    if (oldValue === value) return;
    this.state[key] = value;

    if (this._batchDepth > 0) {
      this._pendingKeys.add(key);
      return;
    }

    this._notify(key, value, oldValue);
  }

  _notify(key, value, oldValue) {
    if (this.listeners[key]) {
      this.listeners[key].forEach(cb => {
        try { cb(value, oldValue); } catch (e) { console.error('Subscriber error:', e); }
      });
    }
  }

  batch(fn) {
    this._batchDepth++;
    try {
      fn();
    } finally {
      this._batchDepth--;
      if (this._batchDepth === 0) {
        this._pendingKeys.forEach(key => {
          this._notify(key, this.state[key], undefined);
        });
        this._pendingKeys.clear();
      }
    }
  }

  getState(key) {
    return this.state[key];
  }

  toggleFavorite(propertyId) {
    const id = String(propertyId);
    const favorites = [...this.state.favorites];
    const index = favorites.indexOf(id);
    const wasAdded = index === -1;

    if (wasAdded) {
      favorites.push(id);
    } else {
      favorites.splice(index, 1);
    }

    this.setState('favorites', favorites);
    Storage.set('favorites', favorites);

    if (this.state.currentUser && window.FavoritesService) {
      const syncAction = wasAdded
        ? window.FavoritesService.add(this.state.currentUser.uid, id)
        : window.FavoritesService.remove(this.state.currentUser.uid, id);
      syncAction.catch((err) => {
        console.error('[Store] Failed to sync favorite to account:', err);
        if (window.Toast) window.Toast.show('Saved on this device, but syncing to your account failed.', 'error');
      });
    }

    return wasAdded;
  }

  isFavorite(propertyId) {
    return this.state.favorites.includes(String(propertyId));
  }
}

const store = new Store();

  window.Store = Store;
  window.store = store;
})();

(function() {
const routes = new Map();
let _currentRoute = 'home';

function registerRoute(name, pageModule) {
  routes.set(name, pageModule);
}

function navigateTo(name, params = {}) {
  if (!routes.has(name)) {
    console.error(`Route "${name}" not found.`);
    return;
  }

  _currentRoute = name;
  store.batch(() => {
    store.setState('currentPage', name);
    if (params.propertyId !== undefined) {
      store.setState('currentPropertyId', params.propertyId);
    }
  });

  const mainContent = document.getElementById('main-content');
  if (!mainContent) return;

  // Update document title based on route
  const titles = {
    home: 'Addis Bet - Premium Real Estate Ethiopia',
    listings: 'Properties - Addis Bet',
    property: params.propertyId ? `Property #${params.propertyId} - Addis Bet` : 'Property - Addis Bet',
    agents: 'Our Agents - Addis Bet',
    blog: 'Real Estate Insights - Addis Bet',
    about: 'About Us - Addis Bet',
    contact: 'Contact Us - Addis Bet',
    dashboard: 'My Dashboard - Addis Bet',
    'add-property': 'Add a Property - Addis Bet',
    'edit-property': 'Edit Property - Addis Bet',
    admin: 'Admin Dashboard - Addis Bet'
  };
  document.title = titles[name] || 'Addis Bet';

  // Sync URL without page reload
  const urlMap = {
    home: '/',
    listings: '/listings',
    property: params.propertyId ? `/property/${params.propertyId}` : '/property',
    agents: '/agents',
    blog: '/blog',
    about: '/about',
    contact: '/contact',
    dashboard: '/dashboard',
    'add-property': '/add-property',
    'edit-property': params.propertyId ? `/edit-property/${params.propertyId}` : '/edit-property',
    admin: '/admin'
  };
  const url = urlMap[name] || '/';
  if (window.location.pathname !== url) {
    window.history.pushState({ page: name, params }, '', url);
  }

  mainContent.innerHTML = '';
  const page = routes.get(name);
  try {
    page.render(mainContent, params);
  } catch (e) {
    console.error('Route render error:', e);
    mainContent.innerHTML = `
      <div class="pt-32 text-center px-4">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Something went wrong</h2>
        <p class="text-gray-600 dark:text-gray-400 mb-4">We couldn't load this page. Please try again.</p>
        <button onclick="navigateTo('home')" class="px-6 py-2 rounded-lg bg-brand-600 text-white font-medium hover:bg-brand-700">Go Home</button>
      </div>
    `;
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getCurrentRoute() {
  return _currentRoute;
}

function getRouteModule(name) {
  return routes.get(name);
}

// Handle browser back/forward buttons
window.addEventListener('popstate', (e) => {
  if (e.state && e.state.page) {
    const page = e.state.page;
    if (routes.has(page)) {
      _currentRoute = page;
      store.setState('currentPage', page);
      const mainContent = document.getElementById('main-content');
      if (mainContent) {
        mainContent.innerHTML = '';
        routes.get(page).render(mainContent, e.state.params || {});
      }
    }
  }
});

  window.registerRoute = registerRoute;
  window.navigateTo = navigateTo;
  window.getCurrentRoute = getCurrentRoute;
  window.getRouteModule = getRouteModule;
})();

    const switchTab = (tab, form, otherTab, otherForm) => {
      tab.classList.add('bg-white', 'dark:bg-gray-600', 'shadow-sm');
      tab.classList.remove('text-gray-600', 'dark:text-gray-300');
      tab.setAttribute('aria-selected', 'true');
      tab.setAttribute('tabindex', '0');
      otherTab.classList.remove('bg-white', 'dark:bg-gray-600', 'shadow-sm');

      tab.focus();

    if (loginTab) {
      loginTab.addEventListener('click', () => switchTab(loginTab, loginForm, registerTab, registerForm));

    if (registerTab) {
      registerTab.addEventListener('click', () => switchTab(registerTab, registerForm, loginTab, loginForm));

          emailError.textContent = 'Please enter a valid email.';

          await window.AuthService.resetPassword(email);

          console.error('[AuthModal] resetPassword failed:', err);

          googleBtn.innerHTML = original;
        }

    if (phoneOtpBtn) {

      loginFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email')?.value?.trim();
        const password = document.getElementById('login-password')?.value;
        const emailError = document.getElementById('login-email-error');
        const passwordError = document.getElementById('login-password-error');
        let valid = true;

        if (!Validator.required(email)) {
          emailError.textContent = 'Email or phone is required.';
          emailError.classList.remove('hidden');
          valid = false;
        } else { emailError.classList.add('hidden'); }

        if (!Validator.minLength(password, 6)) {
          passwordError.textContent = 'Password must be at least 6 characters.';
          passwordError.classList.remove('hidden');
          valid = false;
        } else { passwordError.classList.add('hidden'); }

        if (!valid) return;

        const submitBtn = document.getElementById('login-submit');
        const originalLabel = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        try {
          await window.AuthService.login(email, password);
          this.close();
          showToast('Welcome back!');
        } catch (err) {
          console.error('[AuthModal] login failed:', err);
          emailError.textContent = window.friendlyAuthError ? window.friendlyAuthError(err) : 'Sign-in failed.';
          emailError.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalLabel;
        }
      });
    }

    // Register submit with validation
    const registerFormEl = document.getElementById('register-form');
    if (registerFormEl) {
      registerFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const first = document.getElementById('reg-first')?.value?.trim();
        const last = document.getElementById('reg-last')?.value?.trim();
        const email = document.getElementById('reg-email')?.value?.trim();
        const phone = document.getElementById('reg-phone')?.value?.trim();
        const password = document.getElementById('reg-password')?.value;
        const role = document.getElementById('reg-role')?.value || 'tenant';
        const terms = document.getElementById('reg-terms')?.checked;
        let valid = true;

        const showError = (id, msg) => {
          const el = document.getElementById(id);
          if (el) { el.textContent = msg; el.classList.remove('hidden'); }
        };
        const hideError = (id) => {
          const el = document.getElementById(id);
          if (el) el.classList.add('hidden');
        };

        if (!Validator.required(first)) { showError('reg-first-error', 'First name is required.'); valid = false; }
        else { hideError('reg-first-error'); }
        if (!Validator.required(last)) { showError('reg-last-error', 'Last name is required.'); valid = false; }
        else { hideError('reg-last-error'); }
        if (!Validator.email(email)) { showError('reg-email-error', 'Please enter a valid email.'); valid = false; }
        else { hideError('reg-email-error'); }
        if (!Validator.phone(phone)) { showError('reg-phone-error', 'Please enter a valid phone number.'); valid = false; }
        else { hideError('reg-phone-error'); }
        if (!Validator.minLength(password, 8)) { showError('reg-password-error', 'Password must be at least 8 characters.'); valid = false; }
        else { hideError('reg-password-error'); }
        if (!terms) { showError('reg-terms-error', 'You must agree to the terms.'); valid = false; }
        else { hideError('reg-terms-error'); }

        if (!valid) return;

        const submitBtn = document.getElementById('register-submit');
        const originalLabel = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        try {
          await window.AuthService.register({ email, password, fullName: `${first} ${last}`, phone, role });
          this.close();
          showToast('Account created! Welcome to Addis Bet.');
        } catch (err) {
          console.error('[AuthModal] register failed:', err);
          showError('reg-email-error', window.friendlyAuthError ? window.friendlyAuthError(err) : 'Registration failed.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalLabel;
        }
      });
    }
  }
};

  window.AuthModal = AuthModal;
})();

// ===== src/components/FavoritesModal.js =====
(function() {
const FavoritesModal = {
  _escapeHandler: null,

  open() {
    this.render();
    this.attachEvents();
    const modal = document.getElementById('favorites-modal');
    if (modal) {
      modal.classList.remove('hidden');
      modal.setAttribute('aria-hidden', 'false');
      FocusTrap.activate(modal);
    }
    this.loadFavorites();
  },

  close() {
    const modal = document.getElementById('favorites-modal');
    if (modal) {
      modal.classList.add('hidden');
      modal.setAttribute('aria-hidden', 'true');
    }
    FocusTrap.deactivate();
    if (this._escapeHandler) {
      Keyboard.offEscape(this._escapeHandler);
      this._escapeHandler = null;
    }
  },

  render() {
    const container = document.getElementById('modal-container');
    if (!container) return;

    const existing = document.getElementById('favorites-modal');
    if (existing) existing.remove();

    const favCount = (store.getState('favorites') || []).length;

    const div = document.createElement('div');
    div.id = 'favorites-modal';
    div.className = 'fixed inset-0 z-[70] hidden';
    div.setAttribute('role', 'dialog');
    div.setAttribute('aria-modal', 'true');
    div.setAttribute('aria-label', 'Your Favorites');
    div.innerHTML = `
      <div class="modal-backdrop absolute inset-0 bg-black/60 backdrop-blur-sm" id="fav-backdrop"></div>
      <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
        <div class="modal-content bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[80vh] flex flex-col" role="document">
          <div class="p-6 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center"><i class="fas fa-heart text-red-500" aria-hidden="true"></i></div>
              <div><h3 class="font-bold text-lg">Your Favorites</h3><p id="fav-count-label" class="text-xs text-gray-500">${favCount} saved propert${favCount === 1 ? 'y' : 'ies'}</p></div>
            </div>
            <button id="fav-close" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" aria-label="Close favorites">
              <i class="fas fa-times text-xl" aria-hidden="true"></i>
            </button>
          </div>
          <div id="favorites-list" class="p-6 overflow-y-auto custom-scrollbar flex-1">
            ${Array.from({ length: Math.min(favCount, 3) || 1 }).map(() => `<div class="h-20 bg-gray-100 dark:bg-gray-700 rounded-xl animate-pulse mb-3"></div>`).join('')}
          </div>
        </div>
      </div>
    `;
    container.appendChild(div);
  },

  async loadFavorites() {
    const favorites = store.getState('favorites') || [];
    const listEl = document.getElementById('favorites-list');
    const countLabel = document.getElementById('fav-count-label');

    if (!favorites.length) {
      if (listEl) listEl.innerHTML = `
        <div class="text-center py-12">
          <div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center mx-auto mb-4"><i class="fas fa-heart text-2xl text-gray-400" aria-hidden="true"></i></div>
          <p class="text-gray-500 dark:text-gray-400">No favorites yet. Start browsing and save properties you love!</p>
          <button id="fav-browse-btn" class="mt-4 px-6 py-2 rounded-lg bg-brand-600 text-white text-sm font-medium hover:bg-brand-700">Browse Properties</button>
        </div>
      `;
      document.getElementById('fav-browse-btn')?.addEventListener('click', () => { this.close(); navigateTo('listings'); });
      return;
    }

    let favProps = [];
    try {
      const results = await Promise.all(favorites.map((id) => window.PropertyService.getById(id).catch(() => null)));
      favProps = results.filter(Boolean);
    } catch (err) {
      console.error('[FavoritesModal] Failed to load favorites:', err);
      if (listEl) listEl.innerHTML = `<p class="text-center text-gray-500 dark:text-gray-400 py-10">Couldn't load your favorites. Please try again.</p>`;
      return;
    }

    if (countLabel) countLabel.textContent = `${favProps.length} saved propert${favProps.length === 1 ? 'y' : 'ies'}`;
    if (!listEl) return;

    listEl.innerHTML = favProps.length === 0
      ? `<p class="text-center text-gray-500 dark:text-gray-400 py-10">Your saved properties may have been removed.</p>`
      : favProps.map((p) => `
        <div class="fav-item flex gap-4 p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors cursor-pointer" data-property-id="${p.id}" tabindex="0" role="button" aria-label="View ${Sanitizer.escape(p.title)}">
          <img src="${Sanitizer.sanitizeUrl(p.image)}" class="w-20 h-20 rounded-lg object-cover flex-shrink-0" alt="${Sanitizer.escape(p.title)}" loading="lazy">
          <div class="flex-1 min-w-0">
            <h4 class="font-semibold text-gray-900 dark:text-white text-sm truncate">${Sanitizer.escape(p.title)}</h4>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-1"><i class="fas fa-map-marker-alt mr-1" aria-hidden="true"></i>${Sanitizer.escape(p.location)}</p>
            <p class="text-sm font-bold text-brand-600">${formatPrice(p.price, p.listingType)}</p>
          </div>
          <button class="fav-remove text-red-500 hover:text-red-600 self-start p-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" data-fav-id="${p.id}" aria-label="Remove ${Sanitizer.escape(p.title)} from favorites">
            <i class="fas fa-trash-alt" aria-hidden="true"></i>
          </button>
        </div>
      `).join('');
  },

  attachEvents() {
    const backdrop = document.getElementById('fav-backdrop');
    const closeBtn = document.getElementById('fav-close');
    if (backdrop) backdrop.addEventListener('click', () => this.close());
    if (closeBtn) closeBtn.addEventListener('click', () => this.close());

    this._escapeHandler = () => this.close();
    Keyboard.onEscape(this._escapeHandler);

    const list = document.getElementById('favorites-list');
    if (list) {
      list.addEventListener('click', (e) => {
        const removeBtn = e.target.closest('.fav-remove');
        if (removeBtn) {
          e.stopPropagation();
          const id = removeBtn.dataset.favId;
          store.toggleFavorite(id);
          this.loadFavorites();
          return;
        }

        const item = e.target.closest('.fav-item');
        if (item) {
          const id = item.dataset.propertyId;
          this.close();
          navigateTo('property', { propertyId: id });
        }
      });

      list.addEventListener('keydown', (e) => {
        const item = e.target.closest('.fav-item');
        if (item && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          const id = item.dataset.propertyId;
          this.close();
          navigateTo('property', { propertyId: id });
        }
      });
    }
  }
};

  window.FavoritesModal = FavoritesModal;
})();

            <label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-xs cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"><input type="checkbox" id="filter-balcony" class="rounded text-brand-600" aria-label="Balcony"><span>Balcony</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-xs cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"><input type="checkbox" id="filter-garden" class="rounded text-brand-600" aria-label="Garden"><span>Garden</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-xs cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"><input type="checkbox" id="filter-security" class="rounded text-brand-600" aria-label="Security"><span>Security</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-700 text-xs cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"><input type="checkbox" id="filter-internet" class="rounded text-brand-600" aria-label="Internet"><span>Internet</span></label>
          </div>
        </div>
      </div>
    `;
  },

  attachEvents() {
    document.querySelectorAll('[data-search-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.searchTab;
        store.setState('searchFilters', { ...store.getState('searchFilters'), listingType: tab });
        document.querySelectorAll('[data-search-tab]').forEach(b => {
          b.classList.remove('tab-active');
          b.classList.add('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300', 'hover:bg-gray-200', 'dark:hover:bg-gray-600');
          b.setAttribute('aria-selected', 'false');
          b.setAttribute('tabindex', '-1');
        });
        btn.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300', 'hover:bg-gray-200', 'dark:hover:bg-gray-600');
        btn.classList.add('tab-active');
        btn.setAttribute('aria-selected', 'true');
        btn.setAttribute('tabindex', '0');
      });
    });

    const advToggle = document.getElementById('advanced-filters-toggle');
    if (advToggle) {
      advToggle.addEventListener('click', () => {
        const panel = document.getElementById('advanced-filters');
        if (panel) {
          const isHidden = panel.classList.toggle('hidden');
          panel.setAttribute('aria-hidden', String(isHidden));
          advToggle.setAttribute('aria-expanded', String(!isHidden));
        }
      });
    }

    const searchBtn = document.getElementById('search-btn');
    if (searchBtn) {
      searchBtn.addEventListener('click', debounce(() => this.performSearch(), 300));
    }
  },

  buildFilters() {
    const listingType = store.getState('searchFilters')?.listingType || 'buy';
    const city = document.getElementById('search-city')?.value || '';
    const type = document.getElementById('search-type')?.value || '';
    const beds = document.getElementById('search-beds')?.value || '';
    const subCity = document.getElementById('search-subcity')?.value || '';
    const woreda = document.getElementById('search-woreda')?.value?.trim() || '';
    const neighborhood = document.getElementById('search-neighborhood')?.value?.trim() || '';
    const minPrice = document.getElementById('filter-min-price')?.value || '';
    const maxPrice = document.getElementById('filter-max-price')?.value || '';
    const baths = document.getElementById('filter-baths')?.value || '';
    const areaRange = document.getElementById('filter-area')?.value || '';
    const amenities = ['furnished', 'parking', 'balcony', 'garden', 'security', 'internet']
      .filter((a) => document.getElementById(`filter-${a}`)?.checked)
      .map((a) => a.charAt(0).toUpperCase() + a.slice(1));

    const filters = { listingType, city, type, beds, subCity, woreda, neighborhood, minPrice, maxPrice, baths, amenities };
    if (areaRange) {
      if (areaRange === '500+') { filters.minArea = 500; }
      else {
        const [lo, hi] = areaRange.split('-').map(Number);
        filters.minArea = lo; filters.maxArea = hi;
      }
    }
    return filters;
  },

  performSearch() {
    const filters = this.buildFilters();
    store.setState('searchFilters', { ...store.getState('searchFilters'), ...filters });
    navigateTo('listings', { filters });
  },

  filterByArea(areaName) {
    navigateTo('listings', { filters: { neighborhood: areaName } });
    showToast(`Showing properties in ${areaName.charAt(0).toUpperCase() + areaName.slice(1)}`);
  }
};

  window.Search = Search;
})();

  attachEvents() {
    const navbar = document.getElementById('navbar');
    if (!navbar) return;

    navbar.addEventListener('click', (e) => {
      const navLink = e.target.closest('[data-nav]');
      if (navLink) {
        e.preventDefault();
        const page = navLink.dataset.nav;
        store.setState('isMobileMenuOpen', false);
        navigateTo(page);
      }
    });

    navbar.addEventListener('keydown', (e) => {
      const navLink = e.target.closest('[data-nav]');
      if (navLink && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        const page = navLink.dataset.nav;
        store.setState('isMobileMenuOpen', false);
        navigateTo(page);
      }
    });

    const darkToggle = document.getElementById('dark-mode-toggle');
    if (darkToggle) {
      darkToggle.addEventListener('click', () => {
        const current = store.getState('darkMode');
        store.setState('darkMode', !current);
        Storage.set('darkMode', !current);
      });
    }

    const langToggle = document.getElementById('lang-toggle');
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        const current = store.getState('currentLang');
        const next = current === 'en' ? 'am' : 'en';
        store.setState('currentLang', next);
        showToast(next === 'am' ? 'ቋንቋ ወደ አማርኛ ተቀይሯል' : 'Language switched to English');
        this.refresh();
      });
    }

    const favBtn = document.getElementById('favorites-btn');
    if (favBtn) {
      favBtn.addEventListener('click', () => FavoritesModal.open());
    }

    const authBtn = document.getElementById('auth-btn');
    const accountMenu = document.getElementById('account-menu');
    if (authBtn) {
      authBtn.addEventListener('click', (e) => {
        if (!store.getState('currentUser')) { AuthModal.open(); return; }
        e.stopPropagation();
        const isOpen = accountMenu && !accountMenu.classList.contains('hidden');
        if (accountMenu) accountMenu.classList.toggle('hidden');
        authBtn.setAttribute('aria-expanded', String(!isOpen));
      });
    }

    if (this._outsideClickHandler) document.removeEventListener('click', this._outsideClickHandler);
    if (accountMenu) {
      this._outsideClickHandler = (e) => {
        if (!accountMenu.classList.contains('hidden') && !e.target.closest('#account-menu') && !e.target.closest('#auth-btn')) {
          accountMenu.classList.add('hidden');
          authBtn?.setAttribute('aria-expanded', 'false');
        }
      };
      document.addEventListener('click', this._outsideClickHandler);
    }

    const accountFavBtn = document.getElementById('account-favorites-btn');
    if (accountFavBtn) {
      accountFavBtn.addEventListener('click', () => {
        accountMenu?.classList.add('hidden');
        FavoritesModal.open();
      });
    }

    const accountLogoutBtn = document.getElementById('account-logout-btn');
    if (accountLogoutBtn) {
      accountLogoutBtn.addEventListener('click', async () => {
        accountMenu?.classList.add('hidden');
        try {
          await window.AuthService.logout();
          showToast('Signed out successfully.');
          navigateTo('home');
        } catch (err) {
          console.error('[Navbar] logout failed:', err);
          showToast('Could not sign out. Please try again.', 'error');
        }
      });
    }

    const mobileToggle = document.getElementById('mobile-menu-toggle');
    if (mobileToggle) {
      mobileToggle.addEventListener('click', () => {
        const current = store.getState('isMobileMenuOpen');
        store.setState('isMobileMenuOpen', !current);
        mobileToggle.setAttribute('aria-expanded', String(!current));
        this.refresh();
      });
    }

    const mobileAuth = document.getElementById('mobile-auth-btn');
    if (mobileAuth) {
      mobileAuth.addEventListener('click', async () => {
        store.setState('isMobileMenuOpen', false);
        if (store.getState('currentUser')) {
          try {
            await window.AuthService.logout();
            showToast('Signed out successfully.');
            navigateTo('home');
          } catch (err) {
            console.error('[Navbar] logout failed:', err);
            showToast('Could not sign out. Please try again.', 'error');
          }
        } else {
          AuthModal.open();
        }
      });
    }
  },

  mount(container) {
    container.innerHTML = this.render();
    this.attachEvents();
    this.setupScrollListener();
    this.setupSubscriptions();
  },

  refresh() {
    const container = document.getElementById('navbar-container');
    if (container) this.mount(container);
  },

  setupScrollListener() {
    const navbar = document.getElementById('navbar');
    if (!navbar) return;

    if (this._scrollHandler) {
      window.removeEventListener('scroll', this._scrollHandler);
    }

    this._scrollHandler = throttle(() => {
      if (window.scrollY > 50) {
        navbar.classList.add('bg-white/90', 'dark:bg-gray-900/90', 'backdrop-blur-lg', 'shadow-lg');
        navbar.classList.remove('bg-transparent');
      } else {
        navbar.classList.remove('bg-white/90', 'dark:bg-gray-900/90', 'backdrop-blur-lg', 'shadow-lg');
        navbar.classList.add('bg-transparent');
      }
    }, 100);

    window.addEventListener('scroll', this._scrollHandler, { passive: true });
    this._scrollHandler();
  },

  setupSubscriptions() {
    if (this._favUnsub) this._favUnsub();
    if (this._userUnsub) this._userUnsub();

    this._favUnsub = store.subscribe('favorites', (favs) => {
      const badge = document.getElementById('fav-count');
      if (badge) {
        badge.textContent = favs.length;
        badge.classList.toggle('hidden', favs.length === 0);
      }
    });

    this._userUnsub = store.subscribe('currentUser', () => {
      this.refresh();
    });
  }
};

  window.Navbar = Navbar;
})();

                <p class="text-white/90 mb-8 max-w-lg mx-auto">Join thousands of satisfied customers who found their perfect property through Addis Bet.</p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                  <button id="cta-browse" class="px-8 py-3 rounded-xl bg-white text-brand-700 font-semibold hover:bg-gray-100 transition-colors shadow-lg">Browse Properties</button>
                  <button id="cta-list" class="px-8 py-3 rounded-xl bg-brand-500 text-white font-semibold hover:bg-brand-400 transition-colors shadow-lg border border-white/30">List Your Property</button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    `;

    this.attachEvents();
    LazyLoader.observeAll(container);
    this.loadDynamicSections();
  },

  async loadDynamicSections() {
    try {
      const [featured, newListings] = await Promise.all([
        window.PropertyService.getFeatured(3),
        window.PropertyService.getNewListings(4)
      ]);

      const featuredGrid = document.getElementById('featured-grid');
      if (featuredGrid) {
        featuredGrid.innerHTML = featured.length
          ? featured.map(p => PropertyCard.render(p)).join('')
          : `<p class="col-span-full text-center text-gray-500 dark:text-gray-400 py-8">No featured properties yet. Check back soon!</p>`;
        PropertyCard.attachEvents(featuredGrid);
      }

      const newGrid = document.getElementById('new-listings-grid');
      if (newGrid) {
        newGrid.innerHTML = newListings.length
          ? newListings.map(p => PropertyCard.render(p, true)).join('')
          : `<p class="col-span-full text-center text-gray-500 dark:text-gray-400 py-8">No listings yet. Be the first to add one!</p>`;
        PropertyCard.attachEvents(newGrid);
      }
      LazyLoader.observeAll(document.getElementById('page-home'));
    } catch (err) {
      console.error('[HomePage] Failed to load properties:', err);
      ['featured-grid', 'new-listings-grid'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = `<p class="col-span-full text-center text-gray-500 dark:text-gray-400 py-8">Couldn't load properties. Please check your connection.</p>`;
      });
    }
  },

  attachEvents() {
    Hero.attachEvents();

    const areasGrid = document.getElementById('popular-areas-grid');
    if (areasGrid) {
      areasGrid.addEventListener('click', (e) => {
        const area = e.target.closest('[data-area]');
        if (area) Search.filterByArea(area.dataset.area);
      });
      areasGrid.addEventListener('keydown', (e) => {
        const area = e.target.closest('[data-area]');
        if (area && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          Search.filterByArea(area.dataset.area);
        }
      });
    }

    const viewAll = document.getElementById('view-all-featured');
    if (viewAll) viewAll.addEventListener('click', () => navigateTo('listings'));

    const ctaBrowse = document.getElementById('cta-browse');
    const ctaList = document.getElementById('cta-list');
    if (ctaBrowse) ctaBrowse.addEventListener('click', () => navigateTo('listings'));
    if (ctaList) ctaList.addEventListener('click', () => {
      store.getState('currentUser') ? navigateTo('add-property') : AuthModal.open();
    });
  }
};

  window.HomePage = HomePage;
})();
