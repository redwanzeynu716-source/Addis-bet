(function() {
const ListingsPage = {
  currentView: 'grid',
  filteredProperties: [],
  currentFilters: {},
  lastDoc: null,
  hasMore: false,
  isLoading: false,

  render(container, params = {}) {
    this.currentFilters = params.filters || store.getState('searchFilters') || {};
    this.currentView = store.getState('listingsView') || 'grid';
    this.filteredProperties = [];
    this.lastDoc = null;
    this.hasMore = false;

    const f = this.currentFilters;
    const typeChecks = ['apartment', 'villa', 'condo', 'house'];

    container.innerHTML = `
      <div id="page-listings" class="pt-20">
        <div class="max-w-7xl mx-auto px-4 py-8">
          <div class="flex flex-col lg:flex-row gap-6">
            <aside class="lg:w-72 flex-shrink-0" aria-label="Filters">
              <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg sticky top-24">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-bold text-gray-900 dark:text-white">Filters</h3>
                  <button id="reset-filters" class="text-xs text-brand-600 hover:underline">Reset</button>
                </div>
                <div class="space-y-4">
                  <div>
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 block">Price Range (ETB)</label>
                    <div class="flex gap-2">
                      <input type="number" id="filter-sidebar-min" placeholder="Min" min="0" value="${Sanitizer.escape(f.minPrice || '')}" class="w-full px-3 py-2 rounded-lg bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm" aria-label="Minimum price">
                      <input type="number" id="filter-sidebar-max" placeholder="Max" min="0" value="${Sanitizer.escape(f.maxPrice || '')}" class="w-full px-3 py-2 rounded-lg bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm" aria-label="Maximum price">
                    </div>
                  </div>
                  <fieldset>
                    <legend class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 block">Property Type</legend>
                    <div class="space-y-2">
                      ${typeChecks.map(t => `<label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" class="filter-type rounded text-brand-600" value="${t}" ${f.type === t ? 'checked' : ''} aria-label="${t.charAt(0).toUpperCase() + t.slice(1)}"><span class="capitalize">${t}</span></label>`).join('')}
                    </div>
                  </fieldset>
                  <div>
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 block">Bedrooms</label>
                    <div class="flex gap-2" id="bedroom-filters" role="radiogroup" aria-label="Bedroom filter">
                      ${['any', '1', '2', '3'].map(b => {
                        const active = (f.beds || 'any') === b;
                        return `<button class="bed-filter flex-1 py-2 rounded-lg ${active ? 'bg-brand-600 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200'} text-sm font-medium" data-beds="${b}" role="radio" aria-checked="${active}">${b === 'any' ? 'Any' : (b === '3' ? '3+' : b)}</button>`;
                      }).join('')}
                    </div>
                  </div>
                  <fieldset>
                    <legend class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 block">Amenities</legend>
                    <div class="space-y-2">
                      ${['Parking', 'Garden', 'Security', 'Furnished'].map(a => `<label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" class="filter-amenity rounded text-brand-600" value="${a}" ${(f.amenities || []).includes(a) ? 'checked' : ''} aria-label="${a}"><span>${a}</span></label>`).join('')}
                    </div>
                  </fieldset>
                </div>
              </div>
            </aside>

            <div class="flex-1">
              <div class="flex items-center justify-between mb-6">
                <div>
                  <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Properties</h2>
                  <p id="listings-count" class="text-sm text-gray-600 dark:text-gray-400">Loading results&hellip;</p>
                </div>
                <div class="flex items-center gap-3">
                  <button class="view-toggle p-2 rounded-lg ${this.currentView === 'grid' ? 'bg-brand-100 dark:bg-brand-900/30 text-brand-600' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400'}" data-view="grid" aria-label="Grid view" aria-pressed="${this.currentView === 'grid'}"><i class="fas fa-th-large" aria-hidden="true"></i></button>
                  <button class="view-toggle p-2 rounded-lg ${this.currentView === 'list' ? 'bg-brand-100 dark:bg-brand-900/30 text-brand-600' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400'}" data-view="list" aria-label="List view" aria-pressed="${this.currentView === 'list'}"><i class="fas fa-list" aria-hidden="true"></i></button>
                  <button class="view-toggle p-2 rounded-lg ${this.currentView === 'map' ? 'bg-brand-100 dark:bg-brand-900/30 text-brand-600' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400'}" data-view="map" aria-label="Map view" aria-pressed="${this.currentView === 'map'}"><i class="fas fa-map" aria-hidden="true"></i></button>
                  <label for="listings-sort" class="sr-only">Sort properties</label>
                  <select id="listings-sort" class="px-3 py-2 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 text-sm">
                    <option value="featured">Sort: Featured</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="newest">Newest</option>
                  </select>
                </div>
              </div>

              <div id="listings-results">
                <div id="listings-grid-view" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  ${Array.from({ length: 6 }).map(() => PropertyCard.renderSkeleton()).join('')}
                </div>
              </div>

              <div class="flex justify-center mt-8">
                <button id="load-more-btn" class="hidden px-6 py-3 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors shadow-sm">
                  Load More Properties
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    this.attachEvents();
    this.loadResults();
  },

  buildFilters() {
    const minPrice = document.getElementById('filter-sidebar-min')?.value || '';
    const maxPrice = document.getElementById('filter-sidebar-max')?.value || '';
    const types = Array.from(document.querySelectorAll('.filter-type:checked')).map(el => el.value);
    const activeBed = document.querySelector('.bed-filter[aria-checked="true"]')?.dataset.beds || 'any';
    const amenities = Array.from(document.querySelectorAll('.filter-amenity:checked')).map(el => el.value);

    return {
      ...this.currentFilters,
      minPrice, maxPrice,
      types: types.length && types.length < 4 ? types : undefined,
      type: undefined,
      beds: activeBed !== 'any' ? activeBed : '',
      amenities
    };
  },

  async loadResults(append = false) {
    if (this.isLoading) return;
    this.isLoading = true;
    const countEl = document.getElementById('listings-count');
    const loadMoreBtn = document.getElementById('load-more-btn');
    if (loadMoreBtn) { loadMoreBtn.disabled = true; loadMoreBtn.textContent = 'Loading...'; loadMoreBtn.classList.remove('hidden'); }
    if (!append && countEl) countEl.textContent = 'Loading results\u2026';

    try {
      if (!append) this.currentFilters = this.buildFilters();
      const { results, lastDoc, hasMore } = await window.PropertyService.search(this.currentFilters, {
        pageSize: 12,
        cursor: append ? this.lastDoc : null
      });
      this.filteredProperties = append ? [...this.filteredProperties, ...results] : results;
      this.lastDoc = lastDoc;
      this.hasMore = hasMore;
      this.applySort(document.getElementById('listings-sort')?.value || 'featured');
      this.renderResults();
    } catch (err) {
      console.error('[ListingsPage] Failed to load properties:', err);
      const grid = document.getElementById('listings-grid-view');
      if (grid && !append) {
        grid.innerHTML = `<div class="col-span-2 text-center py-16"><i class="fas fa-triangle-exclamation text-4xl text-amber-500 mb-4" aria-hidden="true"></i><p class="text-gray-600 dark:text-gray-400">Couldn't load properties right now. Please check your connection and try again.</p></div>`;
      }
      if (countEl) countEl.textContent = 'Couldn\u2019t load results';
    } finally {
      this.isLoading = false;
      if (loadMoreBtn) { loadMoreBtn.disabled = false; loadMoreBtn.textContent = 'Load More Properties'; loadMoreBtn.classList.toggle('hidden', !this.hasMore); }
    }
  },

  applySort(mode) {
    const arr = this.filteredProperties;
    if (mode === 'price-asc') arr.sort((a, b) => (a.price || 0) - (b.price || 0));
    else if (mode === 'price-desc') arr.sort((a, b) => (b.price || 0) - (a.price || 0));
    else if (mode === 'newest') { /* already newest-first from the query */ }
    else arr.sort((a, b) => (b.featured === true) - (a.featured === true));
  },

  renderResults() {
    const countEl = document.getElementById('listings-count');
    if (countEl) {
      countEl.textContent = this.filteredProperties.length === 0
        ? 'No properties match your filters'
        : `Showing ${this.filteredProperties.length} result${this.filteredProperties.length === 1 ? '' : 's'}${this.hasMore ? '+' : ''}`;
    }

    const resultsContainer = document.getElementById('listings-results');
    if (!resultsContainer) return;

    if (this.filteredProperties.length === 0) {
      resultsContainer.innerHTML = `
        <div class="text-center py-20 bg-white dark:bg-gray-800 rounded-2xl shadow-lg">
          <i class="fas fa-house-circle-xmark text-5xl text-gray-300 dark:text-gray-600 mb-4" aria-hidden="true"></i>
          <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">No properties found</h3>
          <p class="text-gray-600 dark:text-gray-400 mb-4">Try adjusting your filters or search a different area.</p>
          <button id="empty-reset-filters" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white font-medium hover:bg-brand-700">Clear Filters</button>
        </div>
      `;
      document.getElementById('empty-reset-filters')?.addEventListener('click', () => this.resetFilters());
      return;
    }

    resultsContainer.innerHTML = `
      <div id="listings-grid-view" class="${this.currentView === 'grid' ? '' : 'hidden'} grid grid-cols-1 sm:grid-cols-2 gap-6">
        ${this.filteredProperties.map(p => PropertyCard.render(p)).join('')}
      </div>
      <div id="listings-list-view" class="${this.currentView === 'list' ? '' : 'hidden'} space-y-4">
        ${this.filteredProperties.map(p => PropertyCard.renderList(p)).join('')}
      </div>
      <div id="listings-map-view" class="${this.currentView === 'map' ? '' : 'hidden'} rounded-2xl overflow-hidden shadow-lg">
        <div id="listings-map" class="map-container rounded-2xl" role="region" aria-label="Property map"></div>
      </div>
    `;

    const gridView = document.getElementById('listings-grid-view');
    const listView = document.getElementById('listings-list-view');
    if (gridView) PropertyCard.attachEvents(gridView);
    if (listView) PropertyCard.attachEvents(listView);
    LazyLoader.observeAll(resultsContainer);

    if (this.currentView === 'map') requestAnimationFrame(() => this.initMap());
  },

  resetFilters() {
    this.currentFilters = {};
    store.setState('searchFilters', {});
    document.getElementById('filter-sidebar-min').value = '';
    document.getElementById('filter-sidebar-max').value = '';
    document.querySelectorAll('.filter-type:checked').forEach(el => { el.checked = false; });
    document.querySelectorAll('.filter-amenity:checked').forEach(el => { el.checked = false; });
    document.querySelectorAll('.bed-filter').forEach(b => {
      const isAny = b.dataset.beds === 'any';
      b.classList.toggle('bg-brand-600', isAny);
      b.classList.toggle('text-white', isAny);
      b.classList.toggle('bg-gray-100', !isAny);
      b.classList.toggle('dark:bg-gray-700', !isAny);
      b.classList.toggle('text-gray-600', !isAny);
      b.setAttribute('aria-checked', String(isAny));
    });
    this.loadResults();
    showToast('Filters reset');
  },

  attachEvents() {
    document.querySelectorAll('.view-toggle').forEach(btn => {
      btn.addEventListener('click', () => this.switchView(btn.dataset.view));
    });

    document.getElementById('reset-filters')?.addEventListener('click', () => this.resetFilters());

    const debouncedReload = debounce(() => this.loadResults(), 500);
    document.getElementById('filter-sidebar-min')?.addEventListener('input', debouncedReload);
    document.getElementById('filter-sidebar-max')?.addEventListener('input', debouncedReload);
    document.querySelectorAll('.filter-type').forEach(el => el.addEventListener('change', () => this.loadResults()));
    document.querySelectorAll('.filter-amenity').forEach(el => el.addEventListener('change', () => this.loadResults()));

    const bedFilters = document.getElementById('bedroom-filters');
    if (bedFilters) {
      bedFilters.addEventListener('click', (e) => {
        const btn = e.target.closest('.bed-filter');
        if (!btn) return;
        bedFilters.querySelectorAll('.bed-filter').forEach(b => {
          b.classList.remove('bg-brand-600', 'text-white');
          b.classList.add('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
          b.setAttribute('aria-checked', 'false');
        });
        btn.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
        btn.classList.add('bg-brand-600', 'text-white');
        btn.setAttribute('aria-checked', 'true');
        this.loadResults();
      });
    }

    document.getElementById('listings-sort')?.addEventListener('change', (e) => {
      this.applySort(e.target.value);
      this.renderResults();
    });

    document.getElementById('load-more-btn')?.addEventListener('click', () => this.loadResults(true));
  },

  switchView(view) {
    this.currentView = view;
    store.setState('listingsView', view);

    document.getElementById('listings-grid-view')?.classList.toggle('hidden', view !== 'grid');
    document.getElementById('listings-list-view')?.classList.toggle('hidden', view !== 'list');
    document.getElementById('listings-map-view')?.classList.toggle('hidden', view !== 'map');

    document.querySelectorAll('.view-toggle').forEach(btn => {
      const isActive = btn.dataset.view === view;
      btn.classList.toggle('bg-brand-100', isActive);
      btn.classList.toggle('dark:bg-brand-900/30', isActive);
      btn.classList.toggle('text-brand-600', isActive);
      btn.classList.toggle('bg-gray-100', !isActive);
      btn.classList.toggle('dark:bg-gray-700', !isActive);
      btn.classList.toggle('text-gray-600', !isActive);
      btn.classList.toggle('dark:text-gray-400', !isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });

    if (view === 'map') {
      requestAnimationFrame(() => this.initMap());
    }
  },

  initMap() {
    MapService.destroy();
    const mapEl = document.getElementById('listings-map');
    if (!mapEl) return;

    MapService.init('listings-map');
    this.filteredProperties.forEach(p => {
      MapService.addPropertyMarker(p, (id) => {
        navigateTo('property', { propertyId: id });
      });
    });
  }
};

  window.ListingsPage = ListingsPage;
})();

  async loadSimilar(property) {

      LazyLoader.observeAll(grid);

  attachEvents(property) {
    document.querySelectorAll('[data-nav]').forEach(el => {
      const handler = () => navigateTo(el.dataset.nav);
      el.addEventListener('click', handler);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); }
      });
    });

    document.querySelectorAll('[data-gallery-img]').forEach(thumb => {
      const activate = () => {
        const mainImg = document.getElementById('main-gallery-img');
        if (mainImg) {
          mainImg.style.opacity = '0';
          setTimeout(() => {
            mainImg.src = thumb.dataset.galleryImg;
            mainImg.style.opacity = '1';

        }
        document.querySelectorAll('[data-gallery-img]').forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        thumb.classList.add('active');
        thumb.setAttribute('aria-selected', 'true');

        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
      });
    });

    const favBtn = document.getElementById('detail-fav-btn');

        favBtn.setAttribute('aria-pressed', String(wasAdded));
        favBtn.setAttribute('aria-label', `${wasAdded ? 'Remove from' : 'Add to'} favorites`);
        showToast(wasAdded ? 'Added to favorites' : 'Removed from favorites');
      });
    }

    const shareBtn = document.getElementById('detail-share-btn');
    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({ title: property.title, text: property.description, url: window.location.href }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href).then(() => {
            showToast('Link copied to clipboard!');
          }).catch(() => {});
        }
      });
    }

    const chatBtn = document.getElementById('detail-chat-btn');
    if (chatBtn) {
      chatBtn.addEventListener('click', () => {
        ChatModal.open(property.agent.name, property.agent.image);
      });
    }

    const mortgageBtn = document.getElementById('detail-mortgage-btn');
    if (mortgageBtn) {
      mortgageBtn.addEventListener('click', () => {
        MortgageModal.open(property.price);
      });
    }

    const editBtn = document.getElementById('detail-edit-btn');
    if (editBtn) editBtn.addEventListener('click', () => navigateTo('edit-property', { propertyId: property.id }));

    const deleteBtn = document.getElementById('detail-delete-btn');
    if (deleteBtn) {
      deleteBtn.addEventListener('click', async () => {
        if (!confirm('Delete this listing permanently? This cannot be undone.')) return;
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Deleting...';
        try {
          await window.PropertyService.remove(property.id);
          showToast('Listing deleted.');
          navigateTo('dashboard');
        } catch (err) {
          console.error('[PropertyDetailPage] delete failed:', err);
          showToast('Could not delete listing. Please try again.', 'error');
          deleteBtn.disabled = false;
          deleteBtn.innerHTML = '<i class="fas fa-trash" aria-hidden="true"></i>Delete Listing';
        }
      });
    }

    const reportBtn = document.getElementById('detail-report-btn');
    if (reportBtn) {
      reportBtn.addEventListener('click', () => {
        if (!store.getState('currentUser')) {
          showToast('Please sign in to report a listing.', 'info');
          AuthModal.open();
          return;
        }
        ReportModal.open(property.id, property.title);
      });
    }
  }
};

  window.PropertyDetailPage = PropertyDetailPage;
})();

              <h2 class="font-bold text-gray-900 dark:text-white">Location</h2>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="pf-city" class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 block">City</label>
                  <select id="pf-city" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-brand-500">

                  <select id="pf-subcity" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-brand-500">
                    <option value="">Select sub-city</option>
                    <optgroup label="Addis Ababa">
                      ${['Addis Ketema', 'Akaky Kaliti', 'Arada', 'Bole', 'Gulele', 'Kirkos', 'Kolfe Keranio', 'Lideta', 'Lemi Kura', 'Nifas Silk-Lafto', 'Yeka'].map((s) => `<option value="${s}" ${p.subCity === s ? 'selected' : ''}>${s}</option>`).join('')}

                <div><label for="pf-neighborhood" class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 block">Neighborhood</label><input id="pf-neighborhood" type="text" value="${Sanitizer.escape(p.area_name || '')}" placeholder="e.g. Bole Michael" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-brand-500"></div>
              </div>
              <div>
                <label for="pf-address" class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 block">Street Address (optional)</label>

              </div>
              <div>
                <label class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 block">Pin location on map (click to place, drag to adjust)</label>
                <div id="pf-map" class="rounded-xl overflow-hidden" style="height:260px"></div>
                <input type="hidden" id="pf-lat" value="${p.lat || 9.0084}">
                <input type="hidden" id="pf-lng" value="${p.lng || 38.7575}">
              </div>
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg space-y-4">
              <h2 class="font-bold text-gray-900 dark:text-white">Photos</h2>
              <div id="pf-image-previews" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
              <label for="pf-images" class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl py-8 cursor-pointer hover:border-brand-500 transition-colors">
                <i class="fas fa-cloud-upload-alt text-2xl text-gray-400" aria-hidden="true"></i>
                <span class="text-sm text-gray-500">Click to upload photos (JPG/PNG, up to 10MB each)</span>
              </label>
              <input type="file" id="pf-images" accept="image/*" multiple class="hidden">
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg space-y-4">
              <h2 class="font-bold text-gray-900 dark:text-white">Amenities</h2>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                ${amenitiesList.map((a) => `<label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" class="pf-amenity rounded text-brand-600" value="${a}" ${(p.amenities || []).includes(a) ? 'checked' : ''}><span>${a}</span></label>`).join('')}

              <div>
                <label for="pf-telegram" class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 block">Telegram username (optional, for buyer contact)</label>
                <input id="pf-telegram" type="text" value="${Sanitizer.escape(p.ownerTelegram || '')}" placeholder="e.g. yourusername" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-sm focus:outline-none focus:border-brand-500">
              </div>
            </div>

            <div class="flex gap-3">
              <button id="pf-submit" type="submit" class="flex-1 py-3.5 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 shadow-lg shadow-brand-500/30">${this.isEdit ? 'Save Changes' : 'Submit for Review'}</button>
              <button type="button" id="pf-cancel" class="px-6 py-3.5 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold hover:bg-gray-200 dark:hover:bg-gray-600">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    `;

    this.renderImagePreviews();
    this.attachEvents(user);
    requestAnimationFrame(() => this.initMap(Number(p.lat) || 9.0084, Number(p.lng) || 38.7575));
  },

  initMap(lat, lng) {
    MapService.init('pf-map', [lat, lng], 14);
    const map = MapService.getInstance();
    if (!map || typeof L === 'undefined') return;

    this._mapMarker = L.marker([lat, lng], { draggable: true }).addTo(map);
    const updateInputs = (latlng) => {
      const latInput = document.getElementById('pf-lat');
      const lngInput = document.getElementById('pf-lng');
      if (latInput) latInput.value = latlng.lat;
      if (lngInput) lngInput.value = latlng.lng;
    };
    this._mapMarker.on('dragend', () => updateInputs(this._mapMarker.getLatLng()));
    map.on('click', (e) => {
      this._mapMarker.setLatLng(e.latlng);
      updateInputs(e.latlng);
    });
  },

  renderImagePreviews() {
    const wrap = document.getElementById('pf-image-previews');
    if (!wrap) return;
    const existingHtml = this.existingImages.map((url, i) => `
      <div class="relative aspect-square rounded-lg overflow-hidden group">
        <img src="${Sanitizer.sanitizeUrl(url)}" class="w-full h-full object-cover" alt="Property photo">
        <button type="button" class="pf-remove-existing absolute top-1 right-1 w-6 h-6 rounded-full bg-black/60 text-white text-xs flex items-center justify-center" data-index="${i}" aria-label="Remove image"><i class="fas fa-times" aria-hidden="true"></i></button>
      </div>
    `).join('');
    const pendingHtml = this.pendingFiles.map((file, i) => `
      <div class="relative aspect-square rounded-lg overflow-hidden group">
        <img src="${URL.createObjectURL(file)}" class="w-full h-full object-cover" alt="New photo">
        <span class="absolute bottom-1 left-1 text-[10px] bg-brand-600 text-white px-1.5 py-0.5 rounded">New</span>
        <button type="button" class="pf-remove-pending absolute top-1 right-1 w-6 h-6 rounded-full bg-black/60 text-white text-xs flex items-center justify-center" data-index="${i}" aria-label="Remove image"><i class="fas fa-times" aria-hidden="true"></i></button>
      </div>
    `).join('');
    wrap.innerHTML = (existingHtml + pendingHtml) || '<p class="col-span-full text-sm text-gray-500">No photos added yet.</p>';

    wrap.querySelectorAll('.pf-remove-existing').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.index);
        this.removedImages.push(this.existingImages[idx]);
        this.existingImages.splice(idx, 1);
        this.renderImagePreviews();
      });
    });
    wrap.querySelectorAll('.pf-remove-pending').forEach((btn) => {
      btn.addEventListener('click', () => {
        this.pendingFiles.splice(Number(btn.dataset.index), 1);
        this.renderImagePreviews();
      });
    });
  },

  attachEvents(user) {
    document.getElementById('pf-images')?.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      this.pendingFiles.push(...files);
      this.renderImagePreviews();
      e.target.value = '';
    });

    document.getElementById('pf-cancel')?.addEventListener('click', () => {
      navigateTo(this.isEdit ? 'property' : 'dashboard', this.isEdit ? { propertyId: this.propertyId } : {});
    });

    document.getElementById('property-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      await this.handleSubmit(user);
    });
  },

  async handleSubmit(user) {
    const title = document.getElementById('pf-title')?.value?.trim();
    const price = document.getElementById('pf-price')?.value;
    const titleError = document.getElementById('pf-title-error');
    const priceError = document.getElementById('pf-price-error');
    let valid = true;

    if (!Validator.required(title)) { titleError.textContent = 'Title is required.'; titleError.classList.remove('hidden'); valid = false; }
    else titleError.classList.add('hidden');
    if (!Validator.price(price)) { priceError.textContent = 'Enter a valid price.'; priceError.classList.remove('hidden'); valid = false; }
    else priceError.classList.add('hidden');
    if (!valid) return;

    const formData = {
      title,
      description: document.getElementById('pf-description')?.value?.trim() || '',
      price,
      listingType: document.getElementById('pf-listingtype')?.value,
      type: document.getElementById('pf-type')?.value,
      beds: document.getElementById('pf-beds')?.value || 0,
      baths: document.getElementById('pf-baths')?.value || 0,
      area: document.getElementById('pf-area')?.value || 0,
      city: document.getElementById('pf-city')?.value,
      subCity: document.getElementById('pf-subcity')?.value || '',
      neighborhood: document.getElementById('pf-neighborhood')?.value?.trim() || '',
      woreda: document.getElementById('pf-woreda')?.value?.trim() || '',
      address: document.getElementById('pf-address')?.value?.trim() || '',
      location: document.getElementById('pf-address')?.value?.trim() || '',
      lat: document.getElementById('pf-lat')?.value,
      lng: document.getElementById('pf-lng')?.value,
      amenities: Array.from(document.querySelectorAll('.pf-amenity:checked')).map((el) => el.value),
      ownerTelegram: document.getElementById('pf-telegram')?.value?.trim().replace('@', '') || ''
    };

    const btn = document.getElementById('pf-submit');
    const original = btn.textContent;
    btn.disabled = true;

    try {
      let propertyId = this.propertyId;
      if (!this.isEdit) {
        btn.textContent = 'Creating listing...';
        propertyId = await window.PropertyService.create(formData, user);
      }

      let newUrls = [];
      if (this.pendingFiles.length) {
        newUrls = await window.StorageService.uploadPropertyImages(this.pendingFiles, propertyId, (progress, index, total) => {
          btn.textContent = `Uploading photo ${index + 1} of ${total}\u2026 ${Math.round(progress * 100)}%`;
        });
      }

      const finalImages = [...this.existingImages, ...newUrls];
      btn.textContent = 'Saving...';
      await window.PropertyService.update(propertyId, { ...formData, images: finalImages });

      showToast(this.isEdit ? 'Listing updated!' : 'Listing submitted for review!');
      navigateTo('property', { propertyId });
    } catch (err) {
      console.error('[PropertyFormPage] submit failed:', err);
      showToast(err.message || 'Could not save listing. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = original;
    }
  }
};

  window.PropertyFormPage = PropertyFormPage;
})();

    if (this._authUnsub) { this._authUnsub(); this._authUnsub = null; }

    if (!store.getState('authReady')) {
      container.innerHTML = `<div class="pt-32 flex justify-center" aria-live="polite"><i class="fas fa-spinner fa-spin text-3xl text-brand-500" aria-hidden="true"></i></div>`;
      this._authUnsub = store.subscribe('authReady', () => {
        if (this._authUnsub) { this._authUnsub(); this._authUnsub = null; }
        this.render(container);
      });
      return;
    }

    const user = store.getState('currentUser');
    if (!user || user.role !== 'admin') {
      showToast('Access denied. Admins only.', 'error');
      navigateTo('home');
      return;
    }

    container.innerHTML = `
      <div class="pt-24 pb-16">
        <div class="max-w-7xl mx-auto px-4">
          <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Admin Dashboard</h1>
          <p class="text-gray-600 dark:text-gray-400 mb-8">Manage users, listings, and reports</p>

          <div class="flex gap-2 mb-8 border-b border-gray-200 dark:border-gray-700 overflow-x-auto" role="tablist">
            ${[['pending', 'Pending Properties'], ['properties', 'All Properties'], ['users', 'Users'], ['reports', 'Reports']].map(([key, label]) => `
              <button class="admin-tab px-4 py-3 font-medium text-sm border-b-2 whitespace-nowrap ${this.activeTab === key ? 'border-brand-600 text-brand-600' : 'border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}" data-tab="${key}" role="tab" aria-selected="${this.activeTab === key}">${label}</button>
            `).join('')}
          </div>
          <div id="admin-tab-content">
            <div class="h-40 flex items-center justify-center"><i class="fas fa-spinner fa-spin text-2xl text-brand-500" aria-hidden="true"></i></div>
          </div>
        </div>
      </div>
    `;

    document.querySelectorAll('.admin-tab').forEach((btn) => {
      btn.addEventListener('click', () => { this.activeTab = btn.dataset.tab; this.render(container); });
    });

    this.loadTab();
  },

  async loadTab() {
    const el = document.getElementById('admin-tab-content');
    if (!el) return;
    try {
      if (this.activeTab === 'pending') await this.renderProperties(el, 'pending');
      else if (this.activeTab === 'properties') await this.renderProperties(el, null);
      else if (this.activeTab === 'users') await this.renderUsers(el);
      else await this.renderReports(el);
    } catch (err) {
      console.error('[AdminPage] Failed to load tab:', err);
      el.innerHTML = `<p class="text-center text-gray-500 dark:text-gray-400 py-10">Couldn't load this section. Please try again.</p>`;
    }
  },

  async renderProperties(el, status) {
    const list = await window.AdminService.listProperties(status);
    if (!list.length) {
      el.innerHTML = `<div class="text-center py-16 bg-white dark:bg-gray-800 rounded-2xl shadow"><i class="fas fa-house-circle-check text-4xl text-gray-300 mb-3" aria-hidden="true"></i><p class="text-gray-500 dark:text-gray-400">No properties here.</p></div>`;
      return;
    }
    const statusColors = {
      approved: 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400',
      pending: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400',
      rejected: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'
    };
    el.innerHTML = `<div class="space-y-3">${list.map((p) => `
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 flex flex-col sm:flex-row sm:items-center gap-3">
        <img src="${Sanitizer.sanitizeUrl(p.image || (p.images && p.images[0]) || '')}" class="w-full sm:w-24 h-24 sm:h-16 rounded-lg object-cover bg-gray-100 dark:bg-gray-700 flex-shrink-0" alt="">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-semibold text-gray-900 dark:text-white truncate">${Sanitizer.escape(p.title || 'Untitled')}</h3>
            <span class="text-xs px-2 py-0.5 rounded-full capitalize ${statusColors[p.status] || statusColors.pending}">${p.status || 'pending'}</span>
          </div>
          <p class="text-xs text-gray-500 dark:text-gray-400">Owner: ${Sanitizer.escape(p.ownerName || 'Unknown')} &middot; ${formatPrice(p.price || 0, p.listingType)}</p>
        </div>
        <div class="flex flex-wrap gap-2 flex-shrink-0">
          <button class="admin-view-btn px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-xs" data-id="${p.id}">View</button>
          ${p.status !== 'approved' ? `<button class="admin-approve-btn px-3 py-1.5 rounded-lg bg-green-600 text-white text-xs" data-id="${p.id}">Approve</button>` : ''}
          ${p.status !== 'rejected' ? `<button class="admin-reject-btn px-3 py-1.5 rounded-lg bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 text-xs" data-id="${p.id}">Reject</button>` : ''}
          <button class="admin-verify-btn px-3 py-1.5 rounded-lg ${p.isVerified ? 'bg-brand-600 text-white' : 'bg-gray-100 dark:bg-gray-700'} text-xs" data-id="${p.id}" data-verified="${p.isVerified ? '1' : '0'}">${p.isVerified ? 'Verified' : 'Verify'}</button>
          <button class="admin-delete-prop-btn px-3 py-1.5 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-600 text-xs" data-id="${p.id}">Delete</button>
        </div>
      </div>
    `).join('')}</div>`;

    el.querySelectorAll('.admin-view-btn').forEach((b) => b.addEventListener('click', () => navigateTo('property', { propertyId: b.dataset.id })));
    el.querySelectorAll('.admin-approve-btn').forEach((b) => b.addEventListener('click', async () => {
      try { await window.AdminService.approveProperty(b.dataset.id); showToast('Property approved.'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] approve failed:', err); showToast('Could not approve.', 'error'); }
    }));
    el.querySelectorAll('.admin-reject-btn').forEach((b) => b.addEventListener('click', async () => {
      const reason = prompt('Reason for rejection (shown to the owner):') || '';
      try { await window.AdminService.rejectProperty(b.dataset.id, reason); showToast('Property rejected.'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] reject failed:', err); showToast('Could not reject.', 'error'); }
    }));
    el.querySelectorAll('.admin-verify-btn').forEach((b) => b.addEventListener('click', async () => {
      const nowVerified = b.dataset.verified === '1';
      try { await window.AdminService.verifyProperty(b.dataset.id, !nowVerified); showToast(nowVerified ? 'Verification removed.' : 'Property verified!'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] verify failed:', err); showToast('Could not update verification.', 'error'); }
    }));
    el.querySelectorAll('.admin-delete-prop-btn').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Permanently delete this listing?')) return;
      try { await window.AdminService.deleteProperty(b.dataset.id); showToast('Listing deleted.'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] delete failed:', err); showToast('Could not delete.', 'error'); }
    }));
  },

  async renderUsers(el) {
    const users = await window.AdminService.listUsers();
    if (!users.length) { el.innerHTML = `<p class="text-center text-gray-500 dark:text-gray-400 py-10">No users found.</p>`; return; }
    el.innerHTML = `<div class="space-y-3">${users.map((u) => `
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 flex flex-col sm:flex-row sm:items-center gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-semibold text-gray-900 dark:text-white truncate">${Sanitizer.escape(u.fullName || 'Unnamed')}</h3>
            <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 capitalize">${u.role || 'tenant'}</span>
            ${u.isVerified ? '<span class="text-xs text-brand-600"><i class="fas fa-badge-check" aria-hidden="true"></i> Verified</span>' : ''}
            ${u.suspended ? '<span class="text-xs text-red-600 font-medium">Suspended</span>' : ''}
          </div>
          <p class="text-xs text-gray-500 dark:text-gray-400">${Sanitizer.escape(u.email || '')} &middot; ${Sanitizer.escape(u.phone || 'No phone')}</p>
        </div>
        <div class="flex flex-wrap gap-2 flex-shrink-0">
          ${u.role !== 'admin' ? `
          <button class="admin-verify-user-btn px-3 py-1.5 rounded-lg ${u.isVerified ? 'bg-brand-600 text-white' : 'bg-gray-100 dark:bg-gray-700'} text-xs" data-id="${u.id}" data-verified="${u.isVerified ? '1' : '0'}">${u.isVerified ? 'Verified' : 'Verify'}</button>
          <button class="admin-suspend-user-btn px-3 py-1.5 rounded-lg ${u.suspended ? 'bg-red-600 text-white' : 'bg-gray-100 dark:bg-gray-700'} text-xs" data-id="${u.id}" data-suspended="${u.suspended ? '1' : '0'}">${u.suspended ? 'Unsuspend' : 'Suspend'}</button>
          ` : '<span class="text-xs text-gray-400 italic">Admin account</span>'}
        </div>
      </div>
    `).join('')}</div>`;

    el.querySelectorAll('.admin-verify-user-btn').forEach((b) => b.addEventListener('click', async () => {
      const nowVerified = b.dataset.verified === '1';
      try { await window.AdminService.verifyUser(b.dataset.id, !nowVerified); showToast(nowVerified ? 'Verification removed.' : 'User verified!'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] verifyUser failed:', err); showToast('Could not update user.', 'error'); }
    }));
    el.querySelectorAll('.admin-suspend-user-btn').forEach((b) => b.addEventListener('click', async () => {
      const nowSuspended = b.dataset.suspended === '1';
      if (!nowSuspended && !confirm('Suspend this user? They will be flagged as suspended.')) return;
      try { await window.AdminService.suspendUser(b.dataset.id, !nowSuspended); showToast(nowSuspended ? 'User unsuspended.' : 'User suspended.'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] suspendUser failed:', err); showToast('Could not update user.', 'error'); }
    }));
  },

  async renderReports(el) {
    const reports = await window.AdminService.listReports('open');
    if (!reports.length) { el.innerHTML = `<div class="text-center py-16 bg-white dark:bg-gray-800 rounded-2xl shadow"><i class="fas fa-flag text-4xl text-gray-300 mb-3" aria-hidden="true"></i><p class="text-gray-500 dark:text-gray-400">No open reports. Nice and clean!</p></div>`; return; }
    el.innerHTML = `<div class="space-y-3">${reports.map((r) => `
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4">
        <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
          <span class="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 capitalize">${Sanitizer.escape(r.reason || 'other')}</span>
          <button class="admin-view-reported-btn text-xs text-brand-600 hover:underline" data-id="${r.propertyId}">View listing &rarr;</button>
        </div>
        ${r.details ? `<p class="text-sm text-gray-600 dark:text-gray-400 mb-2">${Sanitizer.escape(r.details)}</p>` : ''}
        <div class="flex gap-2">
          <button class="admin-resolve-report-btn px-3 py-1.5 rounded-lg bg-green-600 text-white text-xs" data-id="${r.id}">Resolve</button>
          <button class="admin-dismiss-report-btn px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-xs" data-id="${r.id}">Dismiss</button>
        </div>
      </div>
    `).join('')}</div>`;

    el.querySelectorAll('.admin-view-reported-btn').forEach((b) => b.addEventListener('click', () => navigateTo('property', { propertyId: b.dataset.id })));
    el.querySelectorAll('.admin-resolve-report-btn').forEach((b) => b.addEventListener('click', async () => {
      try { await window.AdminService.resolveReport(b.dataset.id); showToast('Report resolved.'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] resolveReport failed:', err); showToast('Could not update report.', 'error'); }
    }));
    el.querySelectorAll('.admin-dismiss-report-btn').forEach((b) => b.addEventListener('click', async () => {
      try { await window.AdminService.dismissReport(b.dataset.id); showToast('Report dismissed.'); this.loadTab(); }
      catch (err) { console.error('[AdminPage] dismissReport failed:', err); showToast('Could not update report.', 'error'); }
    }));
  }
};

  window.AdminPage = AdminPage;
})();

                  <select id="contact-subject" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:outline-none focus:border-brand-500 transition-all">
                    <option>General Inquiry</option>
                    <option>List My Property</option>
                    <option>Schedule a Viewing</option>
                    <option>Partnership</option>
                    <option>Other</option>
                  </select>
                </div>
                <div>
                  <label for="contact-message" class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 block">Message</label>
                  <textarea id="contact-message" rows="5" placeholder="How can we help?" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:outline-none focus:border-brand-500 transition-all resize-none" aria-required="true"></textarea>
                  <p id="contact-message-error" class="text-xs text-red-500 mt-1 hidden" role="alert"></p>
                </div>
                <button id="contact-submit" type="submit" class="w-full py-3 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 transition-colors shadow-lg shadow-brand-500/30">Send Message</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    `;
    this.attachEvents();
  },

  attachEvents() {
    const form = document.getElementById('contact-form');
    if (!form) return;

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('contact-name')?.value?.trim();
      const phone = document.getElementById('contact-phone')?.value?.trim();
      const email = document.getElementById('contact-email')?.value?.trim();
      const message = document.getElementById('contact-message')?.value?.trim();

      const showError = (id, msg) => {
        const el = document.getElementById(id);
        if (el) { el.textContent = msg; el.classList.remove('hidden'); }
      };
      const hideError = (id) => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      };

      let valid = true;
      if (!Validator.required(name)) { showError('contact-name-error', 'Name is required.'); valid = false; } else { hideError('contact-name-error'); }
      if (!Validator.phone(phone)) { showError('contact-phone-error', 'Please enter a valid phone number.'); valid = false; } else { hideError('contact-phone-error'); }
      if (!Validator.email(email)) { showError('contact-email-error', 'Please enter a valid email.'); valid = false; } else { hideError('contact-email-error'); }
      if (!Validator.minLength(message, 10)) { showError('contact-message-error', 'Message must be at least 10 characters.'); valid = false; } else { hideError('contact-message-error'); }

      if (!valid) return;

      form.reset();
      showToast('Message sent! We will get back to you soon.');
    });
  }
};

  window.ContactPage = ContactPage;
})();

(function() {
function init() {
  // Hydrate dark mode before first paint
  if (store.getState('darkMode')) {
    document.documentElement.classList.add('dark');
  }

  // Subscribe to dark mode
  store.subscribe('darkMode', (isDark) => {
    document.documentElement.classList.toggle('dark', isDark);
  });

  // Subscribe to toast queue - fixed to properly clear queue after showing
  store.subscribe('toastQueue', (queue) => {
    if (queue.length > 0) {
      const current = queue[queue.length - 1];
      Toast.show(current.message, current.type);
      // Clear the queue to prevent duplicate announcements
      store.setState('toastQueue', []);
    }
  });

  // Register all routes
  registerRoute('home', HomePage);
  registerRoute('listings', ListingsPage);
  registerRoute('property', PropertyDetailPage);
  registerRoute('agents', AgentsPage);
  registerRoute('blog', BlogPage);
  registerRoute('about', AboutPage);
  registerRoute('contact', ContactPage);
  registerRoute('dashboard', DashboardPage);
  registerRoute('add-property', PropertyFormPage);
  registerRoute('edit-property', PropertyFormPage);
  registerRoute('admin', AdminPage);

  // Render shell components
  const navbarContainer = document.getElementById('navbar-container');
  const footerContainer = document.getElementById('footer-container');

  if (navbarContainer) Navbar.mount(navbarContainer);
  if (footerContainer) {
    footerContainer.innerHTML = Footer.render();
    Footer.attachEvents();
  }

  // Handle initial URL
  const path = window.location.pathname;
  const staticRouteMap = {
    '/': 'home',
    '/listings': 'listings',
    '/agents': 'agents',
    '/blog': 'blog',
    '/about': 'about',
    '/contact': 'contact',
    '/dashboard': 'dashboard',
    '/add-property': 'add-property',
    '/admin': 'admin'
  };

  let initialRoute = staticRouteMap[path];
  let initialParams = {};

  if (!initialRoute) {
    const propertyMatch = path.match(/^\/property\/([^/]+)\/?$/);
    const editMatch = path.match(/^\/edit-property\/([^/]+)\/?$/);
    if (propertyMatch) {
      initialRoute = 'property';
      initialParams = { propertyId: decodeURIComponent(propertyMatch[1]) };
    } else if (editMatch) {
      initialRoute = 'edit-property';
      initialParams = { propertyId: decodeURIComponent(editMatch[1]) };
    } else {
      initialRoute = 'home';
    }
  }

  navigateTo(initialRoute, initialParams);

  console.log('[Addis Bet] Application initialized successfully.');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
    </script>
