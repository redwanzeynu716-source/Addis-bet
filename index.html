  query, where, orderBy, limit, startAfter, getDocs, serverTimestamp

function friendlyAuthError(error) {
  const code = error && error.code;
  const map = {
    'auth/email-already-in-use': 'An account with this email already exists. Try signing in instead.',
    'auth/invalid-email': 'Please enter a valid email address.',
    'auth/user-disabled': 'This account has been suspended. Please contact support.',
    'auth/user-not-found': 'No account found with that email or password.',
    'auth/wrong-password': 'No account found with that email or password.',
    'auth/invalid-credential': 'No account found with that email or password.',
    'auth/missing-password': 'Please enter your password.',
    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/popup-closed-by-user': 'Sign-in was cancelled.',
    'auth/cancelled-popup-request': 'Sign-in was cancelled.',
    'auth/popup-blocked': "Your browser blocked the sign-in popup. Please allow popups for this site and try again.",
    'auth/network-request-failed': 'Network error. Please check your connection and try again.',
    'auth/operation-not-allowed': 'This sign-in method is not enabled yet. Please contact the site owner.'
  };
  if (!FIREBASE_CONFIGURED) return 'This site is not fully set up yet (missing Firebase configuration). Please contact the site owner.';
  return map[code] || (error && error.message) || 'Something went wrong. Please try again.';
}

// ===== src/services/authService.js =====
const USERS_COL = 'users';
let _profileWriteInFlight = null;

function emptyProfileFromFirebaseUser(fbUser, roleFallback) {
  return {
    uid: fbUser.uid,
    fullName: fbUser.displayName || 'User',
    email: fbUser.email || '',
    phone: fbUser.phoneNumber || '',
    role: roleFallback || 'tenant',
    profileImage: fbUser.photoURL || '',
    isVerified: false,
    suspended: false,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };
}

function toStoreUser(fbUser, profileData) {
  const p = profileData || {};
  return {
    uid: fbUser.uid,
    name: p.fullName || fbUser.displayName || 'User',
    email: p.email || fbUser.email || '',
    phone: p.phone || fbUser.phoneNumber || '',
    role: p.role || 'tenant',
    profileImage: p.profileImage || fbUser.photoURL || '',
    isVerified: !!p.isVerified,
    suspended: !!p.suspended
  };
}

const AuthService = {
  isConfigured() { return FIREBASE_CONFIGURED; },

  async register({ email, password, fullName, phone, role }) {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const profile = {
      uid: cred.user.uid,
      fullName,
      email,
      phone: phone || '',
      role: role || 'tenant',
      profileImage: '',
      isVerified: false,
      suspended: false,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };
    _profileWriteInFlight = (async () => {
      try { await updateProfile(cred.user, { displayName: fullName }); } catch (e) { /* non-fatal */ }
      await setDoc(doc(db, USERS_COL, cred.user.uid), profile);
    })();
    await _profileWriteInFlight;
    _profileWriteInFlight = null;
    return profile;
  },

  async login(email, password) {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    return cred.user;
  },

  async loginWithGoogle() {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    const existingSnap = await getDoc(doc(db, USERS_COL, result.user.uid));
    if (!existingSnap.exists()) {
      const profile = emptyProfileFromFirebaseUser(result.user, 'tenant');
      _profileWriteInFlight = setDoc(doc(db, USERS_COL, result.user.uid), profile);
      await _profileWriteInFlight;
      _profileWriteInFlight = null;
    }
    return result.user;
  },

  async logout() {
    await signOut(auth);
  },

  async resetPassword(email) {
    await sendPasswordResetEmail(auth, email);
  },

  async getUserProfile(uid) {
    const snap = await getDoc(doc(db, USERS_COL, uid));
    return snap.exists() ? snap.data() : null;
  },

  async updateUserProfile(uid, patch) {
    await updateDoc(doc(db, USERS_COL, uid), { ...patch, updatedAt: serverTimestamp() });
    const current = window.store && window.store.getState('currentUser');
    if (current && current.uid === uid) {
      window.store.setState('currentUser', { ...current, ...patch });
    }
  }
};

onAuthStateChanged(auth, async (fbUser) => {
  const store = window.store;
  if (!fbUser) {
    if (store) { store.setState('currentUser', null); store.setState('authReady', true); }
    return;
  }
  if (_profileWriteInFlight) {
    try { await _profileWriteInFlight; } catch (e) { /* ignore, handled below */ }
  }
  try {
    let snap = await getDoc(doc(db, USERS_COL, fbUser.uid));
    if (!snap.exists()) {
      const minimal = emptyProfileFromFirebaseUser(fbUser, 'tenant');
      await setDoc(doc(db, USERS_COL, fbUser.uid), minimal, { merge: true });
      snap = await getDoc(doc(db, USERS_COL, fbUser.uid));
    }
    const profileData = snap.data();
    if (store) {
      store.setState('currentUser', toStoreUser(fbUser, profileData));
      try { await FavoritesService.mergeGuestFavoritesOnLogin(fbUser.uid); } catch (e) { console.warn('[Favorites] merge on login failed', e); }
    }
  } catch (e) {
    console.error('[AuthService] Failed to load/create user profile:', e);
    if (store) store.setState('currentUser', toStoreUser(fbUser, null));
  } finally {
    if (store) store.setState('authReady', true);
  }
});

function compressImageFile(file, maxDimension = 1600, quality = 0.75) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) {
      reject(new Error('Only image files are allowed.'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the selected file.'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode the selected image.'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          const scale = maxDimension / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('Image compression failed.'));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function randomId() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

const StorageService = {
  /**
   * Compresses and uploads one or more images for a property.
   * @param {FileList|File[]} files
   * @param {string} propertyId
   * @param {(progress:number, index:number, total:number)=>void} [onProgress] progress in [0,1] for the current file
   * @returns {Promise<string[]>} download URLs, in the same order as `files`
   */
  async uploadPropertyImages(files, propertyId, onProgress) {
    const list = Array.from(files || []);
    const urls = [];
    for (let i = 0; i < list.length; i++) {
      const file = list[i];
      if (file.size > 10 * 1024 * 1024) throw new Error(`"${file.name}" is larger than 10MB. Please choose a smaller image.`);
      const compressed = await compressImageFile(file);
      const path = `properties/${propertyId}/${randomId()}.jpg`;
      const storageRef = ref(storage, path);
      const url = await new Promise((resolve, reject) => {
        const task = uploadBytesResumable(storageRef, compressed, { contentType: 'image/jpeg' });
        task.on('state_changed',
          (snap) => { if (onProgress) onProgress(snap.bytesTransferred / snap.totalBytes, i, list.length); },
          reject,
          async () => { try { resolve(await getDownloadURL(task.snapshot.ref)); } catch (err) { reject(err); } }
        );
      });
      urls.push(url);
    }
    return urls;
  },

  async uploadProfileImage(file, uid) {
    if (file.size > 5 * 1024 * 1024) throw new Error('Profile photo must be under 5MB.');
    const compressed = await compressImageFile(file, 512, 0.8);
    const storageRef = ref(storage, `profile-images/${uid}/${randomId()}.jpg`);
    await uploadBytesResumable(storageRef, compressed, { contentType: 'image/jpeg' });
    return getDownloadURL(storageRef);
  },

  async deleteByPath(path) {
    try { await deleteObject(ref(storage, path)); } catch (e) { console.warn('[StorageService] delete failed (non-fatal):', e); }
  }
};

// ===== src/services/propertyService.js =====
const PROPERTIES_COL = 'properties';

function toClientProperty(docSnap) {
  const data = docSnap.data() || {};
  return {
    id: docSnap.id,
    ...data,
    agent: {
      name: data.ownerName || 'Owner',
      phone: data.ownerPhone || '',
      image: data.ownerProfileImage || 'https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=100&q=80',
      rating: typeof data.ownerRating === 'number' ? data.ownerRating : 4.8,
      telegram: data.ownerTelegram || ''
    }
  };
}

const PropertyService = {
  async create(propertyData, ownerUser) {
    if (!ownerUser || !ownerUser.uid) throw new Error('You must be signed in to list a property.');
    const payload = {
      title: propertyData.title || '',
      description: propertyData.description || '',
      price: Number(propertyData.price) || 0,
      currency: 'ETB',
      type: propertyData.type || 'apartment',
      listingType: propertyData.listingType || 'buy',
      beds: Number(propertyData.beds) || 0,
      baths: Number(propertyData.baths) || 0,
      area: Number(propertyData.area) || 0,
      city: propertyData.city || 'addis',
      subCity: propertyData.subCity || '',
      woreda: propertyData.woreda || '',
      area_name: propertyData.neighborhood || propertyData.area_name || '',
      location: propertyData.address || propertyData.location || '',
      address: propertyData.address || propertyData.location || '',
      lat: propertyData.lat != null ? Number(propertyData.lat) : 9.0084,
      lng: propertyData.lng != null ? Number(propertyData.lng) : 38.7575,
      images: propertyData.images || [],
      image: (propertyData.images && propertyData.images[0]) || '',
      amenities: propertyData.amenities || [],
      featured: false,
      new: true,
      premium: false,
      ownerId: ownerUser.uid,
      ownerName: ownerUser.name || 'Owner',
      ownerPhone: ownerUser.phone || '',
      ownerProfileImage: ownerUser.profileImage || '',
      ownerTelegram: propertyData.ownerTelegram || '',
      ownerRole: ownerUser.role || 'landlord',
      isVerified: false,
      status: 'pending',
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };
    const docRef = await addDoc(collection(db, PROPERTIES_COL), payload);
    return docRef.id;
  },

  async update(propertyId, patch) {
    const clean = { ...patch, updatedAt: serverTimestamp() };
    if (clean.price != null) clean.price = Number(clean.price);
    if (clean.beds != null) clean.beds = Number(clean.beds);
    if (clean.baths != null) clean.baths = Number(clean.baths);
    if (clean.area != null) clean.area = Number(clean.area);
    if (clean.images) clean.image = clean.images[0] || '';
    if (clean.lat != null) clean.lat = Number(clean.lat);
    if (clean.lng != null) clean.lng = Number(clean.lng);
    if (clean.neighborhood != null) { clean.area_name = clean.neighborhood; delete clean.neighborhood; }
    if (clean.address != null) clean.location = clean.address;
    await updateDoc(doc(db, PROPERTIES_COL, propertyId), clean);
  },

  async remove(propertyId) {
    await deleteDoc(doc(db, PROPERTIES_COL, propertyId));
  },

  async getById(propertyId) {
    const snap = await getDoc(doc(db, PROPERTIES_COL, propertyId));
    return snap.exists() ? toClientProperty(snap) : null;
  },

  async getFeatured(max = 3) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), where('featured', '==', true), limit(max));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getNewListings(max = 4) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), orderBy('createdAt', 'desc'), limit(max));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getByOwner(ownerId) {
    const q = query(collection(db, PROPERTIES_COL), where('ownerId', '==', ownerId), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getByArea(areaName, max = 20) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), where('area_name', '==', areaName), limit(max));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty);
  },

  async getSimilar(property, max = 4) {
    const q = query(collection(db, PROPERTIES_COL), where('status', '==', 'approved'), where('type', '==', property.type), limit(max + 1));
    const snap = await getDocs(q);
    return snap.docs.map(toClientProperty).filter((p) => p.id !== property.id).slice(0, max);
  },

  /**
   * Hybrid search: narrows on the server by the two most selective, always-present
   * filters (status + listingType) to avoid downloading the whole collection, then
   * refines the returned page client-side by every other filter. See project notes
   * for why (Firestore composite-index limits on many optional filter combinations).
   */
  async search(filters = {}, { pageSize = 20, cursor = null } = {}) {
    const constraints = [where('status', '==', 'approved')];
    if (filters.listingType) constraints.push(where('listingType', '==', filters.listingType));
    constraints.push(orderBy('createdAt', 'desc'));
    if (cursor) constraints.push(startAfter(cursor));
    constraints.push(limit(pageSize));

    const snap = await getDocs(query(collection(db, PROPERTIES_COL), ...constraints));
    let results = snap.docs.map(toClientProperty);
    const lastDoc = snap.docs[snap.docs.length - 1] || null;

    if (filters.city) results = results.filter((p) => p.city === filters.city);
    if (filters.subCity) results = results.filter((p) => p.subCity === filters.subCity);
    if (filters.woreda) results = results.filter((p) => (p.woreda || '').toLowerCase().includes(filters.woreda.toLowerCase()));
    if (filters.neighborhood) results = results.filter((p) => (p.area_name || '').toLowerCase().includes(filters.neighborhood.toLowerCase()));
    if (filters.type) results = results.filter((p) => p.type === filters.type);
    if (filters.types && filters.types.length) results = results.filter((p) => filters.types.includes(p.type));
    if (filters.beds) results = results.filter((p) => Number(p.beds || 0) >= Number(filters.beds));
    if (filters.baths) results = results.filter((p) => Number(p.baths || 0) >= Number(filters.baths));
    if (filters.minPrice) results = results.filter((p) => Number(p.price || 0) >= Number(filters.minPrice));
    if (filters.maxPrice) results = results.filter((p) => Number(p.price || 0) <= Number(filters.maxPrice));
    if (filters.minArea) results = results.filter((p) => Number(p.area || 0) >= Number(filters.minArea));
    if (filters.maxArea) results = results.filter((p) => Number(p.area || 0) <= Number(filters.maxArea));
    if (filters.amenities && filters.amenities.length) {
      results = results.filter((p) => filters.amenities.every((a) => (p.amenities || []).includes(a)));
    }
    return { results, lastDoc, hasMore: snap.docs.length === pageSize };
  }
};

const FavoritesService = {
  async list(uid) {
    const snap = await getDocs(collection(db, USERS_COL, uid, 'favorites'));
    return snap.docs.map((d) => d.id);
  },
  async add(uid, propertyId) {
    await setDoc(doc(db, USERS_COL, uid, 'favorites', String(propertyId)), {
      propertyId: String(propertyId),
      createdAt: serverTimestamp()
    });
  },
  async remove(uid, propertyId) {
    await deleteDoc(doc(db, USERS_COL, uid, 'favorites', String(propertyId)));
  },
  async mergeGuestFavoritesOnLogin(uid) {
    const guestFavs = (window.Storage && window.Storage.get('favorites')) || [];
    const remoteFavs = await this.list(uid);
    const remoteSet = new Set(remoteFavs.map(String));
    const toAdd = guestFavs.map(String).filter((id) => !remoteSet.has(id));
    if (toAdd.length) await Promise.all(toAdd.map((id) => this.add(uid, id)));
    const merged = Array.from(new Set([...remoteFavs.map(String), ...guestFavs.map(String)]));
    if (window.store) window.store.setState('favorites', merged);
    if (window.Storage) window.Storage.set('favorites', merged);
  }
};

/**
 * HTML Sanitizer - prevents XSS by escaping dangerous content.
 * Replaces innerHTML with safe text insertion where possible.
 */
const Sanitizer = {
  _escapeMap: {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#x27;',
    '/': '&#x2F;',
    '`': '&#x60;',
    '=': '&#x3D;'
  },

  escape(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"'`=/]/g, s => this._escapeMap[s]);
  },

  /**
   * Validates and sanitizes a URL to prevent javascript: protocol injection.
   */
  sanitizeUrl(url) {
    if (!url) return '';
    const sanitized = String(url).trim();
    const forbidden = /^javascript:/i;
    if (forbidden.test(sanitized)) return '';
    return sanitized;
  },

  /**
   * Creates a DocumentFragment from HTML string, stripping scripts and event handlers.
   */
  createSafeFragment(html) {
    const template = document.createElement('template');
    template.innerHTML = html;
    const fragment = template.content;
    // Remove all script tags and event handlers
    fragment.querySelectorAll('script').forEach(el => el.remove());
    fragment.querySelectorAll('*').forEach(el => {
      const attrs = Array.from(el.attributes);
      attrs.forEach(attr => {
        if (attr.name.startsWith('on') || attr.name === 'srcdoc') {
          el.removeAttribute(attr.name);
        }
      });
    });
    return fragment;
  }
};

/**
 * Input Validator - client-side validation for forms.
 */
const Validator = {
  email(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(String(email).trim());
  },

  phone(phone) {
    const re = /^\+?[0-9\s\-]{8,20}$/;
    return re.test(String(phone).trim());
  },

  required(value) {
    return String(value).trim().length > 0;
  },

  minLength(value, min) {
    return String(value).trim().length >= min;
  },

  number(value, min, max) {
    const num = Number(value);
    if (Number.isNaN(num)) return false;
    if (min !== undefined && num < min) return false;
    if (max !== undefined && num > max) return false;
    return true;
  },

  price(value) {
    return this.number(value, 0, 100000000000);
  }
};

/**
 * CSRF Token Generator - prepares for backend integration.
 */
const CSRF = {
  _token: null,

  generate() {
    const array = new Uint8Array(32);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(array);
    } else {
      for (let i = 0; i < 32; i++) array[i] = Math.floor(Math.random() * 256);
    }
    this._token = Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
    return this._token;
  },

  getToken() {
    if (!this._token) this.generate();
    return this._token;
  },

  getHeader() {
    return { 'X-CSRF-Token': this.getToken() };
  }
};

/**
 * Debounce utility - limits execution rate for expensive operations.
 */
function debounce(fn, wait = 300) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      fn(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

/**
 * Throttle utility - ensures function runs at most once per period.
 */
function throttle(fn, limit = 100) {
  let inThrottle;
  return function executedFunction(...args) {
    if (!inThrottle) {
      fn(...args);
      inThrottle = true;
      setTimeout(() => inThrottle = false, limit);
    }
  };
}

/**
 * Memoize utility - caches function results.
 */
function memoize(fn, keyFn = JSON.stringify) {
  const cache = new Map();
  return function memoized(...args) {
    const key = keyFn(args);
    if (cache.has(key)) return cache.get(key);
    const result = fn.apply(this, args);
    cache.set(key, result);
    return result;
  };
}

/**
 * LazyLoader - IntersectionObserver-based image lazy loading.
 */
const LazyLoader = {
  _observer: null,
  _init() {
    if (this._observer) return;
    if (!('IntersectionObserver' in window)) {
      // Fallback: load all images immediately
      document.querySelectorAll('img[data-src]').forEach(img => {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      });
      return;
    }
    this._observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          if (img.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');
            img.classList.add('loaded');
          }
          this._observer.unobserve(img);
        }
      });
    }, { rootMargin: '50px' });
  },

  observe(img) {
    this._init();
    if (this._observer && img.dataset.src) {
      this._observer.observe(img);
    }
  },

  observeAll(container = document) {
    this._init();
    if (!this._observer) return;
    container.querySelectorAll('img[data-src]').forEach(img => this._observer.observe(img));
  }
};

// ACCESSIBILITY UTILITIES

/**
 * FocusTrap - traps keyboard focus within a modal/dialog.
 */
const FocusTrap = {
  _activeTrap: null,
  _previousFocus: null,

  activate(container, returnFocus = true) {
    if (this._activeTrap) this.deactivate();
    if (returnFocus) this._previousFocus = document.activeElement;

    const focusable = container.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    const first = focusable[0];
    const last = focusable[focusable.length - 1];

    const handler = (e) => {
      if (e.key !== 'Tab') return;
      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last?.focus();
        }
      } else {
        if (document.activeElement === last) {
          e.preventDefault();
          first?.focus();
        }
      }
    };

    container.addEventListener('keydown', handler);
    this._activeTrap = { container, handler };
    first?.focus();
  },

  deactivate() {
    if (this._activeTrap) {
      this._activeTrap.container.removeEventListener('keydown', this._activeTrap.handler);
      this._activeTrap = null;
    }
    if (this._previousFocus) {
      this._previousFocus.focus();
      this._previousFocus = null;
    }
  }
};

/**
 * Announcer - announces changes to screen readers.
 */
const Announcer = {
  _el: null,

  _getEl() {
    if (!this._el) {
      this._el = document.getElementById('aria-live-announcer');
    }
    return this._el;
  },

  announce(message, priority = 'assertive') {
    const el = this._getEl();
    if (!el) return;
    el.setAttribute('aria-live', priority);
    // Clear and set to ensure announcement
    el.textContent = '';
    requestAnimationFrame(() => {
      el.textContent = message;
    });
  }
};

 * Keyboard utility - handles Escape key for modals.
 */
const Keyboard = {
  _handlers: new Map(),

  onEscape(handler) {
    const wrapper = (e) => {
      if (e.key === 'Escape') handler(e);
    };
    this._handlers.set(handler, wrapper);
    document.addEventListener('keydown', wrapper);
  },

  offEscape(handler) {
    const wrapper = this._handlers.get(handler);
    if (wrapper) {
      document.removeEventListener('keydown', wrapper);
      this._handlers.delete(handler);
    }
  }
};

(function() {
function formatPrice(price, type = 'buy') {
  if (type === 'rent') return 'ETB ' + price.toLocaleString() + '/mo';
  if (price >= 1000000) return 'ETB ' + (price / 1000000).toFixed(1) + 'M';
  return 'ETB ' + price.toLocaleString();
}

function formatPriceFull(price) {
  return 'ETB ' + price.toLocaleString();
}

function formatNumber(num) {
  return num.toLocaleString();
}

function capitalize(str) {
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1);
}

  window.formatPrice = formatPrice;
  window.formatPriceFull = formatPriceFull;
  window.capitalize = capitalize;
})();

// ===== src/utils/dom.js =====
(function() {
const _cleanupRegistry = new WeakMap();

function createElement(html) {
  const template = document.createElement('template');
  template.innerHTML = html.trim();
  return template.content.firstChild;
}

function delegate(container, selector, eventType, handler) {
  if (!container) return function(){};
  const wrapped = (e) => {
    const target = e.target.closest(selector);
    if (target && container.contains(target)) {
      handler(e, target);
    }
  };
  container.addEventListener(eventType, wrapped);
  // Track for cleanup
  if (!_cleanupRegistry.has(container)) _cleanupRegistry.set(container, []);
  _cleanupRegistry.get(container).push({ eventType, wrapped });
  return () => container.removeEventListener(eventType, wrapped);
}

function qs(selector, context = document) {
  return context.querySelector(selector);
}

function qsa(selector, context = document) {
  return context.querySelectorAll(selector);
}

function setHTML(element, html) {
  if (element) {
    // Clear previous listeners before replacing content
    cleanupElement(element);
    element.innerHTML = html;
  }
  return element;
}

function cleanupElement(element) {
  const listeners = _cleanupRegistry.get(element);
  if (listeners) {
    listeners.forEach(({ eventType, wrapped }) => {
      element.removeEventListener(eventType, wrapped);
    });
    _cleanupRegistry.delete(element);
  }
  // Recursively cleanup children
  element.querySelectorAll('*').forEach(child => {
    const childListeners = _cleanupRegistry.get(child);
    if (childListeners) {
      childListeners.forEach(({ eventType, wrapped }) => {
        child.removeEventListener(eventType, wrapped);
      });
      _cleanupRegistry.delete(child);
    }
  });
}

  window.createElement = createElement;
  window.delegate = delegate;
  window.qs = qs;
  window.qsa = qsa;
  window.setHTML = setHTML;
  window.cleanupElement = cleanupElement;
})();

(function() {
const container = document.getElementById('toast-container');

const Toast = {
  show(message, type = 'success', duration = 3000) {
    if (!container) return;

    const icons = {
      success: 'check-circle',
      error: 'exclamation-circle',
      info: 'info-circle'
    };

    const colors = {
      success: 'bg-green-500',
      error: 'bg-red-500',
      info: 'bg-brand-600'
    };

    const toast = document.createElement('div');
    toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 min-w-[280px]`;
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    toast.innerHTML = `<i class="fas fa-${icons[type]}" aria-hidden="true"></i><span class="text-sm font-medium">${Sanitizer.escape(message)}</span>`;

    container.appendChild(toast);
    Announcer.announce(message, 'polite');

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }
};

function showToast(message, type = 'success', duration = 3000) {
  Toast.show(message, type, duration);
}

  window.Toast = Toast;
  window.showToast = showToast;
})();

(function() {
const PREFIX = 'addisBet_';

const Storage = {
  get(key, defaultValue = null) {
    try {
      const item = localStorage.getItem(PREFIX + key);
      return item ? JSON.parse(item) : defaultValue;
    } catch {
      return defaultValue;
    }
  },

  set(key, value) {
    try {
      localStorage.setItem(PREFIX + key, JSON.stringify(value));
    } catch (e) {
      console.warn('Storage set failed:', e);
    }
  },

  remove(key) {
    localStorage.removeItem(PREFIX + key);
  },

  clear() {
    Object.keys(localStorage)
      .filter(k => k.startsWith(PREFIX))
      .forEach(k => localStorage.removeItem(k));
  }
};

  window.Storage = Storage;
})();

(function() {
let mapInstance = null;
let markers = [];

const MapService = {
  init(containerId, center = [9.0054, 38.7636], zoom = 13) {
    this.destroy();
    const container = document.getElementById(containerId);
    if (!container) return null;
    if (typeof L === 'undefined') {
      console.warn('Leaflet library not loaded');
      return null;
    }

    try {
      mapInstance = L.map(containerId).setView(center, zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap</a> contributors'
      }).addTo(mapInstance);
      return mapInstance;
    } catch (e) {
      console.error('Map initialization failed:', e);
      return null;
    }
  },

  addMarker(lat, lng, popupHtml = null) {
    if (!mapInstance || typeof L === 'undefined') return null;
    try {
      const marker = L.marker([lat, lng]).addTo(mapInstance);
      if (popupHtml) {
        marker.bindPopup(popupHtml);
      }
      markers.push(marker);
      return marker;
    } catch (e) {
      console.error('Add marker failed:', e);
      return null;
    }
  },

  addPropertyMarker(property, onClick) {
    if (!mapInstance || typeof L === 'undefined') return null;
    const popup = `
      <div data-property-id="${property.id}" style="cursor:pointer">
        <img src="${Sanitizer.sanitizeUrl(property.image)}" style="width:100%;height:140px;object-fit:cover;border-radius:8px 8px 0 0;margin:-1px" alt="${Sanitizer.escape(property.title)}">
        <div style="padding:12px">

(function() {
const MortgageService = {
  calculate({ price, downPayment = 0, interestRate = 12, years = 20 }) {
    const principal = Math.max(0, price - downPayment);
    const monthlyRate = interestRate / 100 / 12;
    const numPayments = years * 12;

    let monthly = 0;
    if (monthlyRate > 0 && principal > 0) {
      monthly = principal *
        (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) /
        (Math.pow(1 + monthlyRate, numPayments) - 1);
    } else if (principal > 0) {
      monthly = principal / numPayments;
    }

    const totalPayment = monthly * numPayments;
    const totalInterest = totalPayment - principal;

    return {
      monthly: Math.round(monthly),
      totalInterest: Math.round(totalInterest),
      totalPayment: Math.round(totalPayment),
      principal
    };
  }
};

  window.MortgageService = MortgageService;
})();

(function() {
class Store {
  constructor() {
    this.state = {
      currentUser: null,
      authReady: false,
      favorites: [],
      currentLang: 'en',
      darkMode: false,
      currentPage: 'home',
      currentPropertyId: null,
      searchFilters: { listingType: 'buy' },
      listingsView: 'grid',
      authTab: 'login',
      isMobileMenuOpen: false,
      toastQueue: []
    };
    this.listeners = {};
    this._batchDepth = 0;
    this._pendingKeys = new Set();
    this._transaction = false;
    this.loadPersistedState();
  }

  loadPersistedState() {
    try {
      const favs = Storage.get('favorites');
      const dark = Storage.get('darkMode');
      if (favs !== null) this.state.favorites = favs;
      if (dark !== null) this.state.darkMode = dark;
    } catch (e) {
      console.error('Failed to load persisted state', e);
    }
  }

  subscribe(key, callback) {
    if (!this.listeners[key]) this.listeners[key] = [];
    this.listeners[key].push(callback);
    callback(this.state[key], undefined);
    return () => {
      this.listeners[key] = this.listeners[key].filter(cb => cb !== callback);
    };
  }

  setState(key, value) {
    const oldValue = this.state[key];
    if (oldValue === value) return;
    this.state[key] = value;

    if (this._batchDepth > 0) {
      this._pendingKeys.add(key);
      return;
    }

    this._notify(key, value, oldValue);
  }

  _notify(key, value, oldValue) {
    if (this.listeners[key]) {
      this.listeners[key].forEach(cb => {
        try { cb(value, oldValue); } catch (e) { console.error('Subscriber error:', e); }
      });
    }
  }

  batch(fn) {
    this._batchDepth++;
    try {
      fn();
    } finally {
      this._batchDepth--;
      if (this._batchDepth === 0) {
        this._pendingKeys.forEach(key => {
          this._notify(key, this.state[key], undefined);
        });
        this._pendingKeys.clear();
      }
    }
  }

  getState(key) {
    return this.state[key];
  }

  toggleFavorite(propertyId) {
    const id = String(propertyId);
    const favorites = [...this.state.favorites];
    const index = favorites.indexOf(id);
    const wasAdded = index === -1;

    if (wasAdded) {
      favorites.push(id);
    } else {
      favorites.splice(index, 1);
    }

    this.setState('favorites', favorites);
    Storage.set('favorites', favorites);

    if (this.state.currentUser && window.FavoritesService) {
      const syncAction = wasAdded
        ? window.FavoritesService.add(this.state.currentUser.uid, id)
        : window.FavoritesService.remove(this.state.currentUser.uid, id);
      syncAction.catch((err) => {
        console.error('[Store] Failed to sync favorite to account:', err);
        if (window.Toast) window.Toast.show('Saved on this device, but syncing to your account failed.', 'error');
      });
    }

    return wasAdded;
  }

  isFavorite(propertyId) {
    return this.state.favorites.includes(String(propertyId));
  }
}

const store = new Store();

  window.Store = Store;
  window.store = store;
})();

(function() {
const routes = new Map();
let _currentRoute = 'home';

function registerRoute(name, pageModule) {
  routes.set(name, pageModule);
}

function navigateTo(name, params = {}) {
  if (!routes.has(name)) {
    console.error(`Route "${name}" not found.`);
    return;
  }

  _currentRoute = name;
  store.batch(() => {
    store.setState('currentPage', name);
    if (params.propertyId !== undefined) {
      store.setState('currentPropertyId', params.propertyId);
    }
  });

  const mainContent = document.getElementById('main-content');
  if (!mainContent) return;

  // Update document title based on route
  const titles = {
    home: 'Addis Bet - Premium Real Estate Ethiopia',
    listings: 'Properties - Addis Bet',
    property: params.propertyId ? `Property #${params.propertyId} - Addis Bet` : 'Property - Addis Bet',
    agents: 'Our Agents - Addis Bet',
    blog: 'Real Estate Insights - Addis Bet',
    about: 'About Us - Addis Bet',
    contact: 'Contact Us - Addis Bet',
    dashboard: 'My Dashboard - Addis Bet',
    'add-property': 'Add a Property - Addis Bet',
    'edit-property': 'Edit Property - Addis Bet',
    admin: 'Admin Dashboard - Addis Bet'
  };
  document.title = titles[name] || 'Addis Bet';

  // Sync URL without page reload
  const urlMap = {
    home: '/',
    listings: '/listings',
    property: params.propertyId ? `/property/${params.propertyId}` : '/property',
    agents: '/agents',
    blog: '/blog',
    about: '/about',
    contact: '/contact',
    dashboard: '/dashboard',
    'add-property': '/add-property',
    'edit-property': params.propertyId ? `/edit-property/${params.propertyId}` : '/edit-property',
    admin: '/admin'
  };
  const url = urlMap[name] || '/';
  if (window.location.pathname !== url) {
    window.history.pushState({ page: name, params }, '', url);
  }

  mainContent.innerHTML = '';
  const page = routes.get(name);
  try {
    page.render(mainContent, params);
  } catch (e) {
    console.error('Route render error:', e);
    mainContent.innerHTML = `
      <div class="pt-32 text-center px-4">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Something went wrong</h2>
        <p class="text-gray-600 dark:text-gray-400 mb-4">We couldn't load this page. Please try again.</p>
        <button onclick="navigateTo('home')" class="px-6 py-2 rounded-lg bg-brand-600 text-white font-medium hover:bg-brand-700">Go Home</button>
      </div>
    `;
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getCurrentRoute() {
  return _currentRoute;
}

function getRouteModule(name) {
  return routes.get(name);
}

// Handle browser back/forward buttons
window.addEventListener('popstate', (e) => {
  if (e.state && e.state.page) {
    const page = e.state.page;
    if (routes.has(page)) {
      _currentRoute = page;
      store.setState('currentPage', page);
      const mainContent = document.getElementById('main-content');
      if (mainContent) {
        mainContent.innerHTML = '';
        routes.get(page).render(mainContent, e.state.params || {});
      }
    }
  }
});

  window.registerRoute = registerRoute;
  window.navigateTo = navigateTo;
  window.getCurrentRoute = getCurrentRoute;
  window.getRouteModule = getRouteModule;
})();

            </div>
            <button id="report-submit" type="submit" class="w-full py-3 rounded-xl bg-red-600 text-white font-semibold hover:bg-red-700 transition-colors">Submit Report</button>
          </form>
        </div>
      </div>
    `;
    container.appendChild(div);
  },

  attachEvents() {
    const backdrop = document.getElementById('report-backdrop');
    const closeBtn = document.getElementById('report-close');
    if (backdrop) backdrop.addEventListener('click', () => this.close());
    if (closeBtn) closeBtn.addEventListener('click', () => this.close());

    this._escapeHandler = () => this.close();
    Keyboard.onEscape(this._escapeHandler);

    const form = document.getElementById('report-form');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const reason = document.getElementById('report-reason')?.value || 'other';
        const details = document.getElementById('report-details')?.value?.trim() || '';
        const btn = document.getElementById('report-submit');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Submitting...';
        try {
          await window.ReportService.create({ propertyId: this._propertyId, reason, details });
          showToast('Thank you for your report. Our team will review this listing.', 'info');
          this.close();
        } catch (err) {
          console.error('[ReportModal] submit failed:', err);
          showToast('Could not submit report. Please try again.', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    }
  }
};

  window.ReportModal = ReportModal;
})();

                <div class="w-10 h-10 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center"><i class="fas fa-university text-blue-600" aria-hidden="true"></i></div>
                <span class="text-xs font-medium">Chapa</span>
              </div>
              <div class="payment-card border-2 border-gray-200 dark:border-gray-600 rounded-xl p-3 flex flex-col items-center gap-2" data-payment="cbe" role="radio" aria-checked="false" tabindex="0">
                <div class="w-10 h-10 rounded-lg bg-green-100 dark:bg-green-900/30 flex items-center justify-center"><i class="fas fa-landmark text-green-600" aria-hidden="true"></i></div>
                <span class="text-xs font-medium">CBE Birr</span>
              </div>
              <div class="payment-card border-2 border-gray-200 dark:border-gray-600 rounded-xl p-3 flex flex-col items-center gap-2" data-payment="dashen" role="radio" aria-checked="false" tabindex="0">
                <div class="w-10 h-10 rounded-lg bg-orange-100 dark:bg-orange-900/30 flex items-center justify-center"><i class="fas fa-building text-orange-600" aria-hidden="true"></i></div>
                <span class="text-xs font-medium">Dashen Bank</span>
              </div>
            </div>
            <button id="payment-submit" class="w-full py-3 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 transition-colors shadow-lg">Pay Now</button>
          </div>
        </div>
      </div>
    `;
    container.appendChild(div);
  },

  attachEvents() {
    const backdrop = document.getElementById('payment-backdrop');
    const closeBtn = document.getElementById('payment-close');
    if (backdrop) backdrop.addEventListener('click', () => this.close());
    if (closeBtn) closeBtn.addEventListener('click', () => this.close());

    this._escapeHandler = () => this.close();
    Keyboard.onEscape(this._escapeHandler);

    document.querySelectorAll('[data-payment]').forEach(card => {
      const select = () => {
        document.querySelectorAll('[data-payment]').forEach(c => {
          c.classList.remove('selected');
          c.setAttribute('aria-checked', 'false');
        });
        card.classList.add('selected');
        card.setAttribute('aria-checked', 'true');
      };
      card.addEventListener('click', select);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); }
      });
    });

    const submitBtn = document.getElementById('payment-submit');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        const selected = document.querySelector('[data-payment].selected');
        if (!selected) {
          showToast('Please select a payment method', 'error');
          return;
        }
        this.close();
        showToast('Payment processed successfully!');
      });
    }
  }
};

  window.PaymentModal = PaymentModal;
})();
